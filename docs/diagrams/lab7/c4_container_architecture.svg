<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-6%" width="116%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="872" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>

  <!-- Header -->
  <g transform="translate(54, 68)">
    <rect x="0" y="-22" width="168" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="84" y="-5" font-size="11" font-weight="700" fill="#2563eb" text-anchor="middle" letter-spacing="0.5">C4 CONTAINER MODEL</text>
    <text x="0" y="32" font-size="24" font-weight="800" fill="#0f172a">Контейнерная архитектура экосистемы CampusMeet (ЛР7)</text>
    <text x="0" y="58" font-size="13" fill="#64748b">Взаимодействие клиентов, модульного FastAPI сервера, крипто-сервиса HMAC и транзакционного хранилища</text>
  </g>

  <!-- 1. ACTORS TIER -->
  <g transform="translate(54, 160)">
    <rect width="1092" height="110" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">Действующие лица системы (Пользователи &amp; Роли RBAC)</text>

    <!-- Student -->
    <g transform="translate(40, 36)" filter="url(#shadow-node)">
      <rect width="310" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="25" font-size="14" font-weight="700" fill="#0f172a">👤 Студент / Участник</text>
      <text x="18" y="44" font-size="11" fill="#64748b">Роль: attendee (просмотр, регистрация, билет)</text>
    </g>

    <!-- Volunteer -->
    <g transform="translate(390, 36)" filter="url(#shadow-node)">
      <rect width="310" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="25" font-size="14" font-weight="700" fill="#0f172a">📷 Волонтер на входе</text>
      <text x="18" y="44" font-size="11" fill="#64748b">Роль: volunteer (валидация проходов, check-in)</text>
    </g>

    <!-- Organizer -->
    <g transform="translate(740, 36)" filter="url(#shadow-node)">
      <rect width="310" height="58" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="18" y="25" font-size="14" font-weight="700" fill="#0f172a">🎓 Организатор / Преподаватель</text>
      <text x="18" y="44" font-size="11" fill="#64748b">Роль: organizer (квоты, публикация митапов)</text>
    </g>
  </g>

  <!-- Connectors Actors -> Clients -->
  <line x1="249" y1="270" x2="249" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="600" y1="270" x2="895" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="950" y1="270" x2="400" y2="310" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2. CLIENT TIER -->
  <g transform="translate(54, 312)">
    <rect width="1092" height="135" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#7e22ce" letter-spacing="0.5">Клиентский уровень (First Page Starter Modules)</text>

    <!-- Web Client -->
    <g transform="translate(40, 36)" filter="url(#shadow-node)">
      <rect width="480" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
      <rect x="380" y="10" width="88" height="20" rx="10" fill="#f3e8ff"/>
      <text x="424" y="24" font-size="10" font-weight="700" fill="#9333ea" text-anchor="middle">SPA CLIENT</text>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#0f172a">💻 Web Event Catalog (/web/)</text>
      <text x="18" y="48" font-size="11.5" fill="#475569">Адаптивный каталог событий, живой поиск с дебаунсом 300мс,</text>
      <text x="18" y="66" font-size="11.5" fill="#475569">фильтры категорий, цветовой индикатор квот и бронирование</text>
    </g>

    <!-- Mobile Client -->
    <g transform="translate(570, 36)" filter="url(#shadow-node)">
      <rect width="480" height="80" rx="8" fill="#ffffff" stroke="#d8b4fe" stroke-width="1.2"/>
      <rect x="375" y="10" width="93" height="20" rx="10" fill="#f3e8ff"/>
      <text x="421" y="24" font-size="10" font-weight="700" fill="#9333ea" text-anchor="middle">AMOLED PWA</text>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#0f172a">📱 Mobile Pass Screen (/mobile/)</text>
      <text x="18" y="48" font-size="11.5" fill="#475569">Электронный пропуск iPhone 16 Pro (375x812 pt), динамический</text>
      <text x="18" y="66" font-size="11.5" fill="#475569">векторный SVG QR-код, 60с таймер и эмулятор сканера волонтера</text>
    </g>
  </g>

  <!-- Connectors Clients -> Server -->
  <line x1="334" y1="447" x2="334" y2="495" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <rect x="250" y="460" width="168" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="334" y="474" font-size="10" font-weight="600" fill="#6b21a8" text-anchor="middle">REST API / Bearer Token</text>

  <line x1="864" y1="447" x2="864" y2="495" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>
  <rect x="780" y="460" width="168" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="864" y="474" font-size="10" font-weight="600" fill="#6b21a8" text-anchor="middle">POST /check-ins &amp; tickets</text>

  <!-- 3. SERVER TIER (FASTAPI APPLICATION) -->
  <g transform="translate(54, 498)">
    <rect width="1092" height="235" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#15803d" letter-spacing="0.5">Серверная часть (FastAPI Application &amp; Uvicorn ASGI Server • Python 3.12+)</text>

    <!-- Sub-module: Gateway -->
    <g transform="translate(40, 40)" filter="url(#shadow-node)">
      <rect width="230" height="170" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="16" y="26" font-size="13" font-weight="700" fill="#0f172a">🌐 API Gateway (app.py)</text>
      <text x="16" y="48" font-size="11" fill="#475569">• 33 роута OpenAPI 3.0.3</text>
      <text x="16" y="68" font-size="11" fill="#475569">• CORS Middleware</text>
      <text x="16" y="88" font-size="11" fill="#475569">• Swagger UI (/docs)</text>
      <text x="16" y="108" font-size="11" fill="#475569">• ReDoc (/redoc)</text>
      <text x="16" y="128" font-size="11" fill="#475569">• Static mounts (/web, /mobile)</text>
      <text x="16" y="148" font-size="11" fill="#475569">• Healthcheck (/health)</text>
    </g>

    <!-- Sub-module: Schemas -->
    <g transform="translate(295, 40)" filter="url(#shadow-node)">
      <rect width="240" height="170" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="16" y="26" font-size="13" font-weight="700" fill="#0f172a">📋 DTO Schemas (schemas.py)</text>
      <text x="16" y="48" font-size="11" fill="#475569">• Pydantic v2 на Rust</text>
      <text x="16" y="68" font-size="11" fill="#475569">• Строгая проверка типов</text>
      <text x="16" y="88" font-size="11" fill="#475569">• EventCreate, EventResponse</text>
      <text x="16" y="108" font-size="11" fill="#475569">• RegistrationRequest / Ticket</text>
      <text x="16" y="128" font-size="11" fill="#475569">• CheckInRequest / Response</text>
      <text x="16" y="148" font-size="11" fill="#475569">• RFC 7807 ProblemDetails</text>
    </g>

    <!-- Sub-module: Crypto -->
    <g transform="translate(560, 40)" filter="url(#shadow-node)">
      <rect width="240" height="170" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="16" y="26" font-size="13" font-weight="700" fill="#0f172a">🔐 Crypto Engine (crypto.py)</text>
      <text x="16" y="48" font-size="11" fill="#475569">• HMAC-SHA256 подпись</text>
      <text x="16" y="68" font-size="11" fill="#475569">• v1.ticket.user.signature</text>
      <text x="16" y="88" font-size="11" fill="#475569">• compare_digest (защита</text>
      <text x="16" y="106" font-size="11" fill="#475569">   от Timing Attacks)</text>
      <text x="16" y="128" font-size="11" fill="#475569">• Офлайн верификация</text>
      <text x="16" y="148" font-size="11" fill="#475569">• Tamper Detection (100%)</text>
    </g>

    <!-- Sub-module: Store -->
    <g transform="translate(825, 40)" filter="url(#shadow-node)">
      <rect width="230" height="170" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
      <text x="16" y="26" font-size="13" font-weight="700" fill="#0f172a">⚡ Business Logic (store.py)</text>
      <text x="16" y="48" font-size="11" fill="#475569">• Атомарный учет квот мест</text>
      <text x="16" y="68" font-size="11" fill="#475569">• FIFO Waitlist очередь</text>
      <text x="16" y="88" font-size="11" fill="#475569">• Авто-повышение билетов</text>
      <text x="16" y="108" font-size="11" fill="#475569">• Idempotency-Key кэш</text>
      <text x="16" y="128" font-size="11" fill="#475569">• Check-in валидация</text>
      <text x="16" y="148" font-size="11" fill="#475569">• Журнал check_in_logs</text>
    </g>
  </g>

  <!-- Connectors Server -> DB -->
  <line x1="940" y1="733" x2="940" y2="780" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)"/>
  <rect x="850" y="747" width="180" height="20" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="940" y="761" font-size="10" font-weight="600" fill="#047857" text-anchor="middle">SQL Transactions (ACID)</text>

  <!-- 4. DATA STORAGE TIER -->
  <g transform="translate(54, 782)">
    <rect width="1092" height="92" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="20" y="24" font-size="12" font-weight="700" fill="#64748b" letter-spacing="0.5">Слой постоянного хранения данных (Relational Database Tier)</text>

    <!-- SQLite -->
    <g transform="translate(180, 34)" filter="url(#shadow-node)">
      <rect width="340" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="20" y="28" font-size="13" font-weight="700" fill="#0f172a">🗄️ SQLite 3 (WAL mode)</text>
      <text x="200" y="28" font-size="11" fill="#64748b">Локальный запуск &amp; pytest (53 теста)</text>
    </g>

    <!-- PostgreSQL -->
    <g transform="translate(580, 34)" filter="url(#shadow-node)">
      <rect width="340" height="46" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
      <text x="20" y="28" font-size="13" font-weight="700" fill="#0f172a">🐘 PostgreSQL 16 (Alpine)</text>
      <text x="200" y="28" font-size="11" fill="#64748b">Docker Compose &amp; Render Cloud</text>
    </g>
  </g>
</svg>