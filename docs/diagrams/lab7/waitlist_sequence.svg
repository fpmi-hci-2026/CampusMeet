<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 880" width="1240" height="880" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-6%" width="116%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1192" height="832" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>

  <!-- Header -->
  <g transform="translate(54, 68)">
    <rect x="0" y="-22" width="165" height="26" rx="13" fill="#fdf4ff" stroke="#f5d0fe" stroke-width="1"/>
    <text x="82" y="-5" font-size="11" font-weight="700" fill="#a21caf" text-anchor="middle" letter-spacing="0.5">SEQUENCE DIAGRAM</text>
    <text x="0" y="32" font-size="24" font-weight="800" fill="#0f172a">Квотирование, очередь ожидания (Waitlist) и авто-продвижение</text>
    <text x="0" y="56" font-size="13" fill="#64748b">Сценарий заполнения мест (2/2), FIFO постановки в очередь и передачи квоты при отмене билета</text>
  </g>

  <!-- Lifeline Columns (Col 1: 150, Col 2: 410, Col 3: 690, Col 4: 970) -->
  <line x1="150" y1="160" x2="150" y2="820" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="410" y1="160" x2="410" y2="820" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="690" y1="160" x2="690" y2="820" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="970" y1="160" x2="970" y2="820" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Column Badges -->
  <g transform="translate(60, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">👤 Артем (Участник)</text>
  </g>
  <g transform="translate(320, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">👤 Влад (Кандидат)</text>
  </g>
  <g transform="translate(600, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">🌐 FastAPI Сервер</text>
  </g>
  <g transform="translate(880, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">💾 База данных Store</text>
  </g>

  <!-- ================= PHASE 1: WAITLIST JOIN ================= -->
  <g transform="translate(54, 190)">
    <rect width="1132" height="175" rx="10" fill="#fefce8" stroke="#fef08a" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#854d0e">ФАЗА 1: Квота мест исчерпана (2/2) — Влад становится в очередь ожидания (join_waitlist: true)</text>
  </g>

  <rect x="684" y="225" width="12" height="125" rx="3" fill="#93c5fd"/>
  <rect x="964" y="245" width="12" height="85" rx="3" fill="#86efac"/>

  <!-- Vlad -> API -->
  <line x1="410" y1="235" x2="684" y2="235" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="440" y="218" width="220" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="232" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">POST /api/v1/registrations</text>
  <text x="550" y="246" font-size="9.5" fill="#64748b" text-anchor="middle">{ join_waitlist: true, user: "vlad" }</text>

  <!-- API -> DB check -->
  <line x1="696" y1="255" x2="964" y2="255" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="735" y="243" width="190" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="258" font-size="10" fill="#475569" text-anchor="middle">SELECT count(*) FROM tickets</text>

  <!-- DB -> API quota full -->
  <line x1="964" y1="285" x2="696" y2="285" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="720" y="273" width="220" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="288" font-size="10" fill="#475569" text-anchor="middle">2 билета (квота 2/2 исчерпана)</text>

  <!-- API -> DB Insert waitlist -->
  <line x1="696" y1="315" x2="964" y2="315" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="715" y="303" width="230" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="318" font-size="10" font-weight="600" fill="#0f172a" text-anchor="middle">INSERT waitlist_entries (FIFO pos=1)</text>

  <!-- API -> Vlad Response -->
  <line x1="684" y1="342" x2="410" y2="342" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <rect x="440" y="328" width="220" height="26" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="550" y="345" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">201: { status: "waitlisted", pos: 1 } ⏳</text>


  <!-- ================= PHASE 2: CANCELLATION & PROMOTION ================= -->
  <g transform="translate(54, 385)">
    <rect width="1132" height="215" rx="10" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#5b21b6">ФАЗА 2: Артем отменяет свой билет — Сервер автоматически повышает статус Влада (FIFO)</text>
  </g>

  <rect x="684" y="420" width="12" height="165" rx="3" fill="#93c5fd"/>
  <rect x="964" y="445" width="12" height="120" rx="3" fill="#86efac"/>

  <!-- Artem -> API (Spans across Col 2, cleanly masked) -->
  <line x1="150" y1="430" x2="684" y2="430" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- White card cleanly covers Vlad lifeline at 410 -->
  <rect x="235" y="415" width="350" height="28" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-node)"/>
  <text x="410" y="433" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">DELETE /api/v1/tickets/tkt-artem-001 (Bearer demo-artem)</text>

  <!-- API -> DB Cancel ticket -->
  <line x1="696" y1="458" x2="964" y2="458" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="715" y="446" width="230" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="461" font-size="10" fill="#475569" text-anchor="middle">UPDATE tickets status='cancelled'</text>

  <!-- DB Self-call: Promote -->
  <path d="M 976 480 L 1005 480 L 1005 540 L 976 540" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow-purple)"/>

  <!-- Promotion procedure box neatly positioned inside canvas margin (995 to 1170) -->
  <g transform="translate(995, 475)">
    <rect width="180" height="74" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.2" filter="url(#shadow-node)"/>
    <text x="12" y="18" font-size="10.5" font-weight="700" fill="#6b21a8">⚡ FIFO Promotion:</text>
    <text x="12" y="34" font-size="9" fill="#475569">1. SELECT oldest waitlist</text>
    <text x="12" y="48" font-size="9" fill="#475569">2. UPDATE tkt-vlad → registered</text>
    <text x="12" y="62" font-size="9" fill="#475569">3. DELETE FROM waitlist</text>
  </g>

  <!-- API -> Artem Confirmed (Dashed green, cleanly covers Col 2 at 410) -->
  <line x1="684" y1="570" x2="150" y2="570" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <rect x="250" y="556" width="320" height="26" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="410" y="573" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">200 OK: { id: "tkt-artem-001", status: "cancelled" } ✅</text>


  <!-- ================= PHASE 3: VLAD CHECKS TICKET ================= -->
  <g transform="translate(54, 620)">
    <rect width="1132" height="175" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#065f46">ФАЗА 3: Влад запрашивает свой профиль и получает активный билет с HMAC токеном</text>
  </g>

  <rect x="684" y="655" width="12" height="120" rx="3" fill="#93c5fd"/>
  <rect x="964" y="675" width="12" height="65" rx="3" fill="#86efac"/>

  <!-- Vlad -> API -->
  <line x1="410" y1="665" x2="684" y2="665" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="435" y="651" width="230" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="550" y="668" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">GET /api/v1/tickets/tkt-vlad-001</text>

  <!-- API -> DB Fetch -->
  <line x1="696" y1="685" x2="964" y2="685" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="730" y="673" width="200" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="688" font-size="10" fill="#475569" text-anchor="middle">SELECT * FROM tickets WHERE id=...</text>

  <!-- DB -> API status=registered -->
  <line x1="964" y1="718" x2="696" y2="718" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="720" y="706" width="220" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="830" y="721" font-size="10" fill="#475569" text-anchor="middle">status='registered', ticket_code=...</text>

  <!-- API -> Vlad with HMAC -->
  <line x1="684" y1="755" x2="410" y2="755" stroke="#047857" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <rect x="430" y="741" width="240" height="26" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="550" y="758" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">200 OK: { status: "registered", qr: "v1..." } 🎟️</text>

</svg>
