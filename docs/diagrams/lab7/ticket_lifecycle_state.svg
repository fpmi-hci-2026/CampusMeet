<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="1160" height="640" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-6%" width="116%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1112" height="592" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>

  <!-- Header -->
  <g transform="translate(54, 68)">
    <rect x="0" y="-22" width="180" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="90" y="-5" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle" letter-spacing="0.5">STATE MACHINE DIAGRAM</text>
    <text x="0" y="32" font-size="24" font-weight="800" fill="#0f172a">Конечный автомат жизненного цикла билета (Ticket States)</text>
    <text x="0" y="56" font-size="13" fill="#64748b">Переходы состояний: регистрация, попадание в очередь, гашение билета и аннулирование</text>
  </g>

  <!-- Start Point -->
  <circle cx="80" cy="240" r="14" fill="#0f172a"/>
  <circle cx="80" cy="240" r="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Start -> Registered (Direct Horizontal Arrow) -->
  <line x1="98" y1="240" x2="235" y2="240" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="110" y="210" width="112" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="166" y="226" font-size="10.5" font-weight="600" fill="#047857" text-anchor="middle">[Квота есть]</text>

  <!-- Start -> Waitlisted (Orthogonal L-path down and right) -->
  <path d="M 80 258 L 80 440 L 235 440" fill="none" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="95" y="412" width="128" height="24" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="159" y="428" font-size="10" font-weight="600" fill="#a16207" text-anchor="middle">[Мест нет / waitlist]</text>

  <!-- ================= STATE 1: REGISTERED ================= -->
  <g transform="translate(240, 192)" filter="url(#shadow-node)">
    <rect width="260" height="96" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="20" y="32" font-size="17" font-weight="800" fill="#065f46">registered</text>
    <text x="20" y="56" font-size="11.5" fill="#047857">• Сформирован HMAC токен</text>
    <text x="20" y="76" font-size="11.5" fill="#047857">• Отображается активный QR-код</text>
  </g>

  <!-- ================= STATE 2: WAITLISTED ================= -->
  <g transform="translate(240, 392)" filter="url(#shadow-node)">
    <rect width="260" height="96" rx="12" fill="#fefce8" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="20" y="32" font-size="17" font-weight="800" fill="#854d0e">waitlisted</text>
    <text x="20" y="56" font-size="11.5" fill="#a16207">• Запись в waitlist_entries</text>
    <text x="20" y="76" font-size="11.5" fill="#a16207">• QR заблокирован (null)</text>
  </g>

  <!-- Transition: Waitlist -> Registered (FIFO Promotion) -->
  <!-- Clean vertical line in Column 1 (x=330) with arrow pointing up -->
  <line x1="330" y1="392" x2="330" y2="294" stroke="#10b981" stroke-width="2.2" marker-end="url(#arrow-green)"/>
  <rect x="342" y="328" width="150" height="28" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2" filter="url(#shadow-node)"/>
  <text x="417" y="346" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">⚡ FIFO авто-повышение</text>

  <!-- ================= STATE 3: CHECKED IN ================= -->
  <g transform="translate(750, 192)" filter="url(#shadow-node)">
    <rect width="260" height="96" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/>
    <text x="20" y="32" font-size="17" font-weight="800" fill="#581c87">checked_in</text>
    <text x="20" y="56" font-size="11.5" fill="#6b21a8">• Билет погашен волонтером</text>
    <text x="20" y="76" font-size="11.5" fill="#6b21a8">• Повторный вход запрещен</text>
  </g>

  <!-- Transition: Registered -> CheckedIn (Straight horizontal) -->
  <line x1="500" y1="240" x2="744" y2="240" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="565" y="224" width="120" height="26" rx="6" fill="#ffffff" stroke="#ddd6fe" stroke-width="1.2"/>
  <text x="625" y="241" font-size="11" font-weight="700" fill="#6b21a8" text-anchor="middle">Check-in OK ✅</text>

  <!-- ================= STATE 4: CANCELLED ================= -->
  <g transform="translate(750, 392)" filter="url(#shadow-node)">
    <rect width="260" height="96" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="20" y="32" font-size="17" font-weight="800" fill="#991b1b">cancelled</text>
    <text x="20" y="56" font-size="11.5" fill="#b91c1c">• Билет аннулирован</text>
    <text x="20" y="76" font-size="11.5" fill="#b91c1c">• Квота передана в очередь</text>
  </g>

  <!-- Transition: Registered -> Cancelled (Clean Bezier Route through center gap) -->
  <path d="M 500 262 C 600 262, 650 415, 744 415" fill="none" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="555" y="324" width="140" height="28" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2" filter="url(#shadow-node)"/>
  <text x="625" y="342" font-size="10.5" font-weight="700" fill="#dc2626" text-anchor="middle">DELETE /tickets/{id}</text>

  <!-- Transition: Waitlisted -> Cancelled (Straight horizontal) -->
  <line x1="500" y1="440" x2="744" y2="440" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="565" y="448" width="120" height="26" rx="6" fill="#ffffff" stroke="#fecaca" stroke-width="1.2"/>
  <text x="625" y="465" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">Отказ от очереди</text>

  <!-- ================= TERMINAL END POINTS (SEPARATED & ACCURATE) ================= -->
  <!-- CheckedIn Terminal Point -->
  <g transform="translate(1040, 240)">
    <circle cx="0" cy="0" r="14" fill="#047857"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Checkmark inside -->
    <path d="M -5 0 L -1 4 L 5 -3" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <line x1="1010" y1="240" x2="1022" y2="240" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)"/>

  <!-- Cancelled Terminal Point -->
  <g transform="translate(1040, 440)">
    <circle cx="0" cy="0" r="14" fill="#b91c1c"/>
    <circle cx="0" cy="0" r="18" fill="none" stroke="#ef4444" stroke-width="2"/>
    <!-- Cross inside -->
    <path d="M -4 -4 L 4 4 M 4 -4 L -4 4" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  </g>
  <line x1="1010" y1="440" x2="1022" y2="440" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-red)"/>

  <text x="1040" y="278" font-size="11" font-weight="600" fill="#047857" text-anchor="middle">Использован</text>
  <text x="1040" y="478" font-size="11" font-weight="600" fill="#b91c1c" text-anchor="middle">Аннулирован</text>

</svg>
