<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-6%" width="116%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="952" height="512" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>

  <!-- Header -->
  <g transform="translate(54, 68)">
    <rect x="0" y="-22" width="175" height="26" rx="13" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="87" y="-5" font-size="11" font-weight="700" fill="#15803d" text-anchor="middle" letter-spacing="0.5">STATE MACHINE DIAGRAM</text>
    <text x="0" y="32" font-size="24" font-weight="800" fill="#0f172a">Конечный автомат жизненного цикла билета (Ticket States)</text>
    <text x="0" y="56" font-size="13" fill="#64748b">Переходы состояний: регистрация, попадание в очередь, гашение билета и аннулирование</text>
  </g>

  <!-- Start Point -->
  <circle cx="90" cy="230" r="14" fill="#0f172a"/>
  <circle cx="90" cy="230" r="18" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Arrow Start -> Registered -->
  <line x1="108" y1="230" x2="280" y2="230" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="135" y="200" width="120" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="195" y="215" font-size="10.5" font-weight="600" fill="#047857" text-anchor="middle">[Квота свободна]</text>

  <!-- Arrow Start -> Waitlisted -->
  <path d="M 90 248 C 90 380, 160 380, 280 380" fill="none" stroke="#ca8a04" stroke-width="1.8" marker-end="url(#arrow)"/>
  <rect x="120" y="355" width="135" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="187" y="370" font-size="10.5" font-weight="600" fill="#a16207" text-anchor="middle">[Мест нет &amp; waitlist]</text>

  <!-- State 1: Registered -->
  <g transform="translate(285, 185)" filter="url(#shadow-node)">
    <rect width="240" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="20" y="32" font-size="16" font-weight="800" fill="#065f46">registered</text>
    <text x="20" y="54" font-size="11.5" fill="#047857">• Сформирован HMAC токен</text>
    <text x="20" y="72" font-size="11.5" fill="#047857">• Отображается активный QR</text>
  </g>

  <!-- State 2: Waitlisted -->
  <g transform="translate(285, 335)" filter="url(#shadow-node)">
    <rect width="240" height="90" rx="12" fill="#fefce8" stroke="#f59e0b" stroke-width="1.8"/>
    <text x="20" y="32" font-size="16" font-weight="800" fill="#854d0e">waitlisted</text>
    <text x="20" y="54" font-size="11.5" fill="#a16207">• Запись в waitlist_entries</text>
    <text x="20" y="72" font-size="11.5" fill="#a16207">• QR заблокирован (null)</text>
  </g>

  <!-- Transition: Waitlist -> Registered (FIFO Promotion) -->
  <path d="M 405 335 L 405 285" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="415" y="295" width="170" height="26" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="500" y="312" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">⚡ FIFO авто-повышение</text>

  <!-- State 3: Checked In -->
  <g transform="translate(680, 185)" filter="url(#shadow-node)">
    <rect width="240" height="90" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="1.8"/>
    <text x="20" y="32" font-size="16" font-weight="800" fill="#581c87">checked_in</text>
    <text x="20" y="54" font-size="11.5" fill="#6b21a8">• Билет погашен волонтером</text>
    <text x="20" y="72" font-size="11.5" fill="#6b21a8">• Повторный вход запрещен</text>
  </g>

  <!-- Transition: Registered -> CheckedIn -->
  <line x1="525" y1="230" x2="675" y2="230" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="545" y="205" width="110" height="22" rx="4" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="600" y="220" font-size="10.5" font-weight="700" fill="#6b21a8" text-anchor="middle">Check-in OK ✅</text>

  <!-- State 4: Cancelled -->
  <g transform="translate(680, 335)" filter="url(#shadow-node)">
    <rect width="240" height="90" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.8"/>
    <text x="20" y="32" font-size="16" font-weight="800" fill="#991b1b">cancelled</text>
    <text x="20" y="54" font-size="11.5" fill="#b91c1c">• Билет аннулирован</text>
    <text x="20" y="72" font-size="11.5" fill="#b91c1c">• Квота передана в очередь</text>
  </g>

  <!-- Transition: Registered -> Cancelled -->
  <path d="M 480 275 C 530 330, 600 350, 675 365" fill="none" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="520" y="335" width="125" height="22" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="582" y="350" font-size="10" font-weight="600" fill="#dc2626" text-anchor="middle">DELETE /tickets/{id}</text>

  <!-- Transition: Waitlisted -> Cancelled -->
  <line x1="525" y1="380" x2="675" y2="380" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="550" y="388" width="105" height="20" rx="4" fill="#ffffff" stroke="#fecaca"/>
  <text x="602" y="402" font-size="9.5" font-weight="600" fill="#dc2626" text-anchor="middle">Отказ от очереди</text>

  <!-- End point -->
  <g transform="translate(775, 470)">
    <circle cx="25" cy="25" r="14" fill="#0f172a"/>
    <circle cx="25" cy="25" r="18" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="55" y="30" font-size="12" font-weight="600" fill="#64748b">Финальное состояние билета</text>
  </g>
  <line x1="800" y1="275" x2="800" y2="335" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="800" y1="425" x2="800" y2="470" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

</svg>