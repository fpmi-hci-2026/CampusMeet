<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-6%" width="116%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="792" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>

  <!-- Header -->
  <g transform="translate(54, 68)">
    <rect x="0" y="-22" width="170" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="85" y="-5" font-size="11" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">CHECK-IN PROTOCOL</text>
    <text x="0" y="32" font-size="24" font-weight="800" fill="#0f172a">Диаграмма верификации билетов и чекина волонтером</text>
    <text x="0" y="56" font-size="13" fill="#64748b">Проверка HMAC-SHA256 подписи, предотвращение повторных проходов (409) и аудит в check_in_logs</text>
  </g>

  <!-- Lifeline Columns (Col 1: 160, Col 2: 450, Col 3: 750, Col 4: 1040) -->
  <line x1="160" y1="160" x2="160" y2="780" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="450" y1="160" x2="450" y2="780" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="750" y1="160" x2="750" y2="780" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="1040" y1="160" x2="1040" y2="780" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Column Badges -->
  <g transform="translate(70, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">📷 Волонтер (Дарья)</text>
  </g>
  <g transform="translate(360, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">🌐 FastAPI (/check-ins)</text>
  </g>
  <g transform="translate(660, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">🔐 Модуль crypto.py</text>
  </g>
  <g transform="translate(950, 118)" filter="url(#shadow-node)">
    <rect width="180" height="46" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
    <text x="90" y="28" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">💾 База данных Store</text>
  </g>

  <!-- Step 1: Scan trigger (Vol -> API) -->
  <rect x="444" y="195" width="12" height="570" rx="3" fill="#93c5fd"/>

  <line x1="160" y1="205" x2="444" y2="205" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="185" y="188" width="240" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="305" y="202" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">POST /api/v1/events/.../check-ins</text>
  <text x="305" y="216" font-size="9.5" fill="#64748b" text-anchor="middle">payload: { client_scan_id, qr_payload }</text>

  <!-- Step 2: RBAC Check (API Self-call) -->
  <path d="M 456 235 L 490 235 L 490 258 L 456 258" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="498" y="236" width="225" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="610" y="251" font-size="10" font-weight="600" fill="#475569" text-anchor="middle">Проверка роли (volunteer) &amp; event_staff</text>

  <!-- Step 3: Crypto verification (API -> Crypto) -->
  <line x1="456" y1="282" x2="744" y2="282" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="480" y="268" width="240" height="26" rx="6" fill="#ffffff" stroke="#d8b4fe"/>
  <text x="600" y="285" font-size="11" font-weight="600" fill="#6b21a8" text-anchor="middle">verify_ticket_signature(token, event_id)</text>

  <rect x="744" y="278" width="12" height="48" rx="3" fill="#d8b4fe"/>

  <line x1="744" y1="318" x2="456" y2="318" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <rect x="485" y="306" width="230" height="24" rx="6" fill="#f0fdf4" stroke="#86efac"/>
  <text x="600" y="322" font-size="10.5" font-weight="700" fill="#15803d" text-anchor="middle">Signature Valid (compare_digest = True)</text>

  <!-- ================= CASE A: VALID FIRST PASS ================= -->
  <g transform="translate(54, 345)">
    <rect width="1092" height="195" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#065f46">СЦЕНАРИЙ А (Первичный проход): Билет 'registered' — Допуск разрешен (GRANTED)</text>
  </g>

  <!-- API -> DB (UPDATE & LOG) -->
  <line x1="456" y1="395" x2="1034" y2="395" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Dedicated pill completely covers Crypto lifeline at 750 -->
  <rect x="525" y="377" width="450" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-node)"/>
  <text x="750" y="392" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">UPDATE tickets SET status='checked_in' WHERE id='tkt-001'</text>
  <text x="750" y="407" font-size="10" fill="#475569" text-anchor="middle">INSERT INTO check_in_logs (verdict='GRANTED', operator_id='dar')</text>

  <!-- DB Activation -->
  <rect x="1034" y="390" width="12" height="60" rx="3" fill="#86efac"/>

  <!-- DB -> API Response -->
  <line x1="1034" y1="440" x2="456" y2="440" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="580" y="427" width="340" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="750" y="444" font-size="10.5" fill="#475569" text-anchor="middle">Запись сохранена: { id: "chk-001", verdict: "GRANTED" }</text>

  <!-- API -> Volunteer Response -->
  <line x1="444" y1="495" x2="160" y2="495" stroke="#047857" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <rect x="180" y="481" width="250" height="28" rx="6" fill="#ecfdf5" stroke="#86efac" stroke-width="1.2"/>
  <text x="305" y="499" font-size="11" font-weight="800" fill="#047857" text-anchor="middle">201 Created: { verdict: "GRANTED" } ✅</text>

  <!-- ================= CASE B: DUPLICATE SCAN ================= -->
  <g transform="translate(54, 555)">
    <rect width="1092" height="195" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="20" y="24" font-size="12" font-weight="800" fill="#991b1b">СЦЕНАРИЙ Б (Повторное сканирование): Билет уже 'checked_in' — Проход заблокирован (409 Conflict)</text>
  </g>

  <!-- API -> DB (Check & Denial Log) -->
  <line x1="456" y1="605" x2="1034" y2="605" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Dedicated pill completely covers Crypto lifeline at 750 -->
  <rect x="525" y="587" width="450" height="36" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" filter="url(#shadow-node)"/>
  <text x="750" y="602" font-size="10.5" font-weight="700" fill="#b91c1c" text-anchor="middle">Статус билета: 'checked_in' (уже использован!)</text>
  <text x="750" y="617" font-size="10" fill="#475569" text-anchor="middle">INSERT INTO check_in_logs (verdict='DENIED_ALREADY_USED')</text>

  <!-- DB Activation -->
  <rect x="1034" y="600" width="12" height="60" rx="3" fill="#fca5a5"/>

  <!-- DB -> API Response -->
  <line x1="1034" y1="650" x2="456" y2="650" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <rect x="580" y="637" width="340" height="26" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="750" y="654" font-size="10.5" fill="#b91c1c" text-anchor="middle">Зафиксирована повторная попытка прохода (409)</text>

  <!-- API -> Volunteer Response -->
  <line x1="444" y1="705" x2="160" y2="705" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <rect x="175" y="691" width="260" height="28" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
  <text x="305" y="709" font-size="11" font-weight="800" fill="#dc2626" text-anchor="middle">409 Conflict: DENIED_ALREADY_USED ⛔</text>

</svg>
