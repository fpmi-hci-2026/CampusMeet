<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">

  <defs>
    <filter id="shadow-card" x="-4%" y="-3%" width="108%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>
    <filter id="shadow-node" x="-8%" y="-6%" width="116%" height="118%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ef4444"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <rect x="24" y="24" width="1052" height="672" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>

  <!-- Header -->
  <g transform="translate(54, 68)">
    <rect x="0" y="-22" width="168" height="26" rx="13" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1"/>
    <text x="84" y="-5" font-size="11" font-weight="700" fill="#047857" text-anchor="middle" letter-spacing="0.5">CHECK-IN PROTOCOL</text>
    <text x="0" y="32" font-size="24" font-weight="800" fill="#0f172a">Диаграмма верификации билетов и чекина волонтером</text>
    <text x="0" y="56" font-size="13" fill="#64748b">Проверка HMAC-SHA256 подписи, предотвращение повторных проходов (409) и аудит в check_in_logs</text>
  </g>

  <!-- Lifeline Columns -->
  <!-- Col 1: Volunteer (160), Col 2: API (450), Col 3: Crypto (740), Col 4: Store DB (970) -->
  <line x1="160" y1="160" x2="160" y2="670" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="450" y1="160" x2="450" y2="670" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="740" y1="160" x2="740" y2="670" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>
  <line x1="970" y1="160" x2="970" y2="670" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6,6"/>

  <!-- Badges -->
  <g transform="translate(80, 120)" filter="url(#shadow-node)">
    <rect width="160" height="44" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="80" y="27" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">📷 Волонтер (Дарья)</text>
  </g>
  <g transform="translate(365, 120)" filter="url(#shadow-node)">
    <rect width="170" height="44" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="1.2"/>
    <text x="85" y="27" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">🌐 FastAPI (/check-ins)</text>
  </g>
  <g transform="translate(655, 120)" filter="url(#shadow-node)">
    <rect width="170" height="44" rx="8" fill="#faf5ff" stroke="#c084fc" stroke-width="1.2"/>
    <text x="85" y="27" font-size="13" font-weight="700" fill="#6b21a8" text-anchor="middle">🔐 Модуль crypto.py</text>
  </g>
  <g transform="translate(885, 120)" filter="url(#shadow-node)">
    <rect width="170" height="44" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.2"/>
    <text x="85" y="27" font-size="13" font-weight="700" fill="#166534" text-anchor="middle">💾 База данных Store</text>
  </g>

  <!-- Step 1: Scan trigger -->
  <rect x="444" y="200" width="12" height="440" rx="3" fill="#93c5fd"/>

  <line x1="160" y1="205" x2="444" y2="205" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="302" y="198" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">POST /api/v1/events/ev-campusmeet-2026/check-ins</text>
  <text x="302" y="220" font-size="10.5" fill="#64748b" text-anchor="middle">{ client_scan_id: "scan-01", qr_payload: "v1.tkt-001.usr-001.sig" }</text>

  <!-- Step 2: RBAC Check -->
  <path d="M 456 235 L 490 235 L 490 260 L 456 260" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="252" font-size="11" fill="#475569">Проверка роли (volunteer/organizer) &amp; event_staff</text>

  <!-- Step 3: Crypto verification -->
  <line x1="456" y1="285" x2="734" y2="285" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <text x="595" y="278" font-size="11" font-weight="600" fill="#6b21a8" text-anchor="middle">verify_ticket_signature(token, event_id)</text>

  <rect x="734" y="280" width="12" height="45" rx="3" fill="#d8b4fe"/>
  <line x1="734" y1="315" x2="456" y2="315" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-purple)"/>
  <text x="595" y="310" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">Signature Valid (True) via compare_digest</text>

  <!-- ================= CASE A: VALID FIRST PASS ================= -->
  <g transform="translate(60, 345)">
    <rect width="980" height="145" rx="8" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.2"/>
    <text x="16" y="22" font-size="12" font-weight="800" fill="#065f46">СЦЕНАРИЙ А (Первичный проход): Билет 'registered' — Допуск разрешен (GRANTED)</text>
  </g>

  <line x1="456" y1="385" x2="964" y2="385" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="378" font-size="11" fill="#475569" text-anchor="middle">UPDATE tickets SET status='checked_in'; INSERT INTO check_in_logs (verdict='GRANTED')</text>

  <rect x="964" y="380" width="12" height="50" rx="3" fill="#86efac"/>
  <line x1="964" y1="415" x2="456" y2="415" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="710" y="410" font-size="11" fill="#475569" text-anchor="middle">Запись сохранена: { id: "chk-001", verdict: "GRANTED" }</text>

  <line x1="444" y1="465" x2="160" y2="465" stroke="#047857" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-green)"/>
  <text x="302" y="457" font-size="12" font-weight="800" fill="#047857" text-anchor="middle">201 Created: { verdict: "GRANTED", status: "checked_in" } ✅</text>


  <!-- ================= CASE B: DUPLICATE SCAN ================= -->
  <g transform="translate(60, 505)">
    <rect width="980" height="140" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.2"/>
    <text x="16" y="22" font-size="12" font-weight="800" fill="#991b1b">СЦЕНАРИЙ Б (Повторное сканирование): Билет уже 'checked_in' — Проход заблокирован (409 Conflict)</text>
  </g>

  <line x1="456" y1="545" x2="964" y2="545" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="710" y="538" font-size="11" fill="#475569" text-anchor="middle">Статус билета: 'checked_in' -> INSERT INTO check_in_logs (verdict='DENIED_ALREADY_USED')</text>

  <rect x="964" y="540" width="12" height="50" rx="3" fill="#fca5a5"/>
  <line x1="964" y1="575" x2="456" y2="575" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
  <text x="710" y="570" font-size="11" fill="#b91c1c" text-anchor="middle">Зафиксирована повторная попытка</text>

  <line x1="444" y1="620" x2="160" y2="620" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow-red)"/>
  <text x="302" y="612" font-size="12" font-weight="800" fill="#dc2626" text-anchor="middle">409 Conflict: { title: "DENIED_ALREADY_USED", detail: "Билет уже использован" } ⛔</text>

</svg>