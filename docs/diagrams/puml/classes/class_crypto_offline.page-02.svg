енты. Справа — ссылки на те же сущности, а не новые объекты. Каждая связь находится в отдельной</text><text x="36" y="173" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#525252">полосе.</text><line x1="36" y1="214" x2="1084" y2="214" stroke="#d4d4d4" /><text x="36" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#525252">01 / 06</text><rect x="36" y="272" width="580" height="215" rx="7" fill="white" stroke="#a3a3a3" stroke-width="1.3" /><path d="M 43,272 H 609 Q 616,272 616,279 V 323 H 36 V 279 Q 36,272 43,272" fill="#F8FAFC" /><text x="54" y="299" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#171717" font-weight="bold">TicketPayload</text><text x="54" y="346" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">+ ticket_id: UUID</text><text x="54" y="370" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">- event_id: UUID</text><text x="54" y="394" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">+ user_id: UUID</text><text x="54" y="418" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">+ issued_timestamp: Long</text><text x="54" y="442" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">+ expires_timestamp: Long</text><text x="54" y="466" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">+ toCanonicalString(): String</text><rect x="814" y="272" width="270" height="95" rx="7" fill="white" stroke="#a3a3a3" stroke-width="1.3" /><path d="M 821,272 H 1077 Q 1084,272 1084,279 V 323 H 814 V 279 Q 814,272 821,272" fill="#f7f7f7" /><text x="832" y="299" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#171717" font-weight="bold">HMACSigner</text><text x="832" y="346" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#525252">Ссылка на сущность</text><polyline points="616,345 814,345" fill="none" stroke="#525252" stroke-width="1.6" stroke-linejoin="ro