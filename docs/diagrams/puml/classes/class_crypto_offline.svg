<svg xmlns="http://www.w3.org/2000/svg" width="1120" role="img" height="1774" viewBox="0 0 1120 1774" data-layout="fixed-lanes-v1"><title>Диаграмма классов: Криптографическая защита и офлайн-валидация билета (Задание 4)</title><desc>Модель разделена на фрагменты. Справа — ссылки на те же сущности, а не новые объекты. Каждая связь находится в отдельной полосе.</desc><rect x="0" y="0" width="1120" height="1774" fill="white" /><text x="36" y="34.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#525252">CAMPUSMEET / ПРОЕКТНАЯ ДОКУМЕНТАЦИЯ</text><text x="36" y="74" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#171717" font-weight="bold">Диаграмма классов: Криптографическая защита и офлайн-валидация</text><text x="36" y="108" font-family="Arial, Helvetica, sans-serif" font-size="27" fill="#171717" font-weight="bold">билета (Задание 4)</text><text x="36" y="148" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#525252">Модель разделена на фрагменты. Справа — ссылки на те же сущности, а не новые объекты. Каждая связь находится в отдельной</text><text x="36" y="173" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#525252">полосе.</text><line x1="36" y1="214" x2="1084" y2="214" stroke="#d4d4d4" /><text x="36" y="258.0" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#525252">01 / 06</text><rect x="36" y="272" width="580" height="215" rx="7" fill="white" stroke="#a3a3a3" stroke-width="1.3" /><path d="M 43,272 H 609 Q 616,272 616,279 V 323 H 36 V 279 Q 36,272 43,272" fill="#F8FAFC" /><text x="54" y="299" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#171717" font-weight="bold">TicketPayload</text><text x="54" y="346" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">+ ticket_id: UUID</text><text x="54" y="370" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#171717">- event_id: UUID</text><text x="54" y="394" font-family="Arial, Helvetica,