      <text x="735" y="170" fill="#a1a1aa" font-size="13">Иван К. (Сканер №2)</text>
      <rect x="925" y="155" width="135" height="26" rx="4" fill="#212121" stroke="#383838"/>
      <text x="992" y="172" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">✓ Подтвержден</text>

      <!-- Row 3: Duplicate Warning -->
