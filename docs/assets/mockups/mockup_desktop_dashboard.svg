      <text x="25" y="216" fill="#ffffff" font-size="13" font-weight="bold">16:46:40</text>
      <text x="125" y="216" fill="#ffffff" font-size="13" font-weight="bold">Костылев Владислав</text>
      <text x="380" y="216" fill="#a1a1aa" font-size="13">Сторонний гость</text>
      <text x="565" y="216" fill="#ffffff" font-size="13" font-weight="600">Билет #42 (Скриншот)</text>
      <text x="735" y="216" fill="#a1a1aa" font-size="13">Дарья М. (Сканер №1)</text>
      <rect x="925" y="201" width="155" height="26" rx="4" fill="#ffffff"/>
      <text x="1002" y="218" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">[!] Дубликат (16:34)</text>

      <!-- Row 4 -->
      <line x1="0" y1="236" x2="1120" y2="236" stroke="#212121"/>
      <text x="25" y="262" fill="#a1a1aa" font-size="13">16:45:10</text>
      <text x="125" y="262" fill="#ffffff" font-size="13" font-weight="bold">Громов Виктор Михайлович</text>
      <text x="380" y="262" fill="#a1a1aa" font-size="13">Lead Backend Arch</text>
      <text x="565" y="262" fill="#ffffff" font-size="13" font-weight="bold">Спикер (VIP pass)</text>
      <text x="735" y="262" fill="#a1a1aa" font-size="13">Максим Р. (Организатор)</text>
      <rect x="925" y="247" width="135" height="26" rx="4" fill="#212121" stroke="#383838"/>
