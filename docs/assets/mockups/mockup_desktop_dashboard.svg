      <text x="25" y="170" fill="#a1a1aa" font-size="13">16:47:58</text>
      <text x="125" y="170" fill="#ffffff" font-size="13" font-weight="bold">Савицкий Кирилл Павлович</text>
      <text x="380" y="170" fill="#a1a1aa" font-size="13">ФПМИ БГУ, 4 курс</text>
