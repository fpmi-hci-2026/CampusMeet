      <text x="48" y="510" fill="#a1a1aa" font-size="12">WebSocket активен • 88 чекинов обработано • Синхронизация с БД: 0.1с</text>
      
      <rect x="850" y="493" width="75" height="26" rx="4" fill="#212121" stroke="#383838"/>
      <text x="887" y="510" fill="#ffffff" font-size="11" text-anchor="middle">← Назад</text>
      <text x="965" y="510" fill="#71717a" font-size="11" text-anchor="middle">Стр. 1 из 11</text>
      <rect x="1005" y="493" width="75" height="26" rx="4" fill="#212121" stroke="#383838"/>
      <text x="1042" y="510" fill="#ffffff" font-size="11" text-anchor="middle">Вперед →</text>
