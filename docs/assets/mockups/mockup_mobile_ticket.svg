<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Phone Shell -->
  <rect width="375" height="812" rx="42" fill="#0d0d0d" stroke="#262626" stroke-width="3"/>
  <rect x="125" y="12" width="125" height="28" rx="14" fill="#000000"/>

  <!-- Header -->
  <g transform="translate(20, 55)">
    <text x="0" y="20" fill="#ffffff" font-size="18">←</text>
    <text x="167" y="20" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle">Мой электронный билет</text>
    <text x="335" y="20" fill="#ffffff" font-size="16" text-anchor="end">↗</text>
  </g>

  <!-- Offline Status Capsule -->
  <g transform="translate(20, 95)">
    <rect width="335" height="32" rx="8" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
    <circle cx="20" cy="16" r="4" fill="#ffffff"/>
    <text x="32" y="20" fill="#ffffff" font-size="11" font-weight="600">OFFLINE-READY • Билет сохранен в памяти телефона</text>
  </g>

  <!-- Ticket Body -->
  <g transform="translate(20, 140)">
    <rect width="335" height="530" rx="16" fill="#171717" stroke="#2f2f2f" stroke-width="1.5"/>

    <!-- Header ribbon of ticket -->
    <rect width="335" height="90" rx="16" fill="#212121"/>
    <text x="20" y="30" fill="#a1a1aa" font-size="11" font-weight="800" letter-spacing="1">БГУ ФПМИ • IT-МИТАП</text>
    <text x="20" y="55" fill="#ffffff" font-size="17" font-weight="800">CampusMeet: AI &amp; Web 2026</text>
    <text x="20" y="75" fill="#a1a1aa" font-size="12">15 октября 2026 • 17:00 • Ауд. 512 (5 этаж)</text>

    <!-- Guest metadata -->
    <g transform="translate(20, 115)">
      <text x="0" y="0" fill="#71717a" font-size="10" font-weight="700">ГОСТЬ / СЛУШАТЕЛЬ</text>
      <text x="0" y="22" fill="#ffffff" font-size="15" font-weight="800">Артём Ковалёв</text>
      <text x="0" y="38" fill="#a1a1aa" font-size="11">ФПМИ БГУ, 3 курс</text>

      <text x="210" y="0" fill="#71717a" font-size="10" font-weight="700">МЕСТО / КВОТА</text>
      <text x="210" y="22" fill="#ffffff" font-size="15" font-weight="800">#88 / 100</text>
      <text x="210" y="38" fill="#a1a1aa" font-size="11">Подтверждено</text>
    </g>

    <!-- Ticket tear punch -->
    <line x1="15" y1="180" x2="320" y2="180" stroke="#2f2f2f" stroke-dasharray="6,6" stroke-width="1.5"/>
    <circle cx="0" cy="180" r="12" fill="#0d0d0d"/>
    <circle cx="335" cy="180" r="12" fill="#0d0d0d"/>

    <!-- Dynamic Contrast QR Code Box -->
    <g transform="translate(62, 205)">
      <!-- Pure white box for optical reading -->
      <rect width="210" height="210" rx="14" fill="#ffffff"/>
      
      <!-- QR Locators -->
      <rect x="20" y="20" width="45" height="45" fill="#0d0d0d"/>
      <rect x="28" y="28" width="29" height="29" fill="#ffffff"/>
      <rect x="34" y="34" width="17" height="17" fill="#0d0d0d"/>

      <rect x="145" y="20" width="45" height="45" fill="#0d0d0d"/>
      <rect x="153" y="28" width="29" height="29" fill="#ffffff"/>
      <rect x="159" y="34" width="17" height="17" fill="#0d0d0d"/>

      <rect x="20" y="145" width="45" height="45" fill="#0d0d0d"/>
      <rect x="28" y="153" width="29" height="29" fill="#ffffff"/>
      <rect x="34" y="159" width="17" height="17" fill="#0d0d0d"/>

      <!-- Matrix pixels -->
      <rect x="80" y="30" width="15" height="15" fill="#0d0d0d"/>
      <rect x="105" y="40" width="20" height="18" fill="#0d0d0d"/>
      <rect x="75" y="80" width="30" height="30" fill="#0d0d0d"/>
      <rect x="120" y="90" width="25" height="25" fill="#0d0d0d"/>
      <rect x="155" y="90" width="20" height="20" fill="#0d0d0d"/>
      <rect x="30" y="90" width="30" height="30" fill="#0d0d0d"/>
      <rect x="80" y="145" width="35" height="20" fill="#0d0d0d"/>
      <rect x="135" y="150" width="30" height="30" fill="#0d0d0d"/>

      <rect x="85" y="95" width="40" height="20" rx="4" fill="#0d0d0d"/>
      <text x="105" y="109" fill="#ffffff" font-size="9" font-weight="900" text-anchor="middle">PASS</text>
    </g>

    <text x="167" y="435" fill="#a1a1aa" font-size="11" text-anchor="middle">Токен: HMAC-SHA256 • Валиден еще 42с</text>
    <text x="167" y="455" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">[OK] Яркость дисплея выставлена на 100%</text>

    <!-- Apple Wallet button -->
    <g transform="translate(30, 475)">
      <rect width="275" height="42" rx="8" fill="#000000" stroke="#383838"/>
      <text x="137" y="26" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">Add to Apple Wallet</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 735)">
    <rect width="375" height="77" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
    <text x="48" y="38" fill="#71717a" font-size="11" text-anchor="middle">Афиша</text>
    <text x="142" y="38" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">● Билеты</text>
    <text x="236" y="38" fill="#71717a" font-size="11" text-anchor="middle">Команды</text>
    <text x="328" y="38" fill="#71717a" font-size="11" text-anchor="middle">Профиль</text>
  </g>
</svg>