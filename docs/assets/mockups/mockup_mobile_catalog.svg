<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Mobile phone shell -->
  <rect width="375" height="812" rx="42" fill="#0d0d0d" stroke="#262626" stroke-width="3"/>
  <rect x="125" y="12" width="125" height="28" rx="14" fill="#000000"/>

  <!-- Mobile Header -->
  <g transform="translate(20, 55)">
    <rect width="28" height="28" rx="6" fill="#ffffff"/>
    <text x="14" y="19" fill="#0d0d0d" font-size="13" font-weight="900" text-anchor="middle">CM</text>
    <text x="36" y="20" fill="#ffffff" font-size="16" font-weight="800">CampusMeet</text>
    <circle cx="320" cy="15" r="14" fill="#212121" stroke="#383838"/>
    <text x="320" y="19" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">АК</text>
  </g>

  <!-- Search Input with pill -->
  <g transform="translate(20, 98)">
    <rect width="335" height="40" rx="8" fill="#171717" stroke="#2f2f2f"/>
    <text x="18" y="25" fill="#71717a" font-size="13">Поиск митапов, хакатонов...</text>
  </g>

  <!-- Category Pills carousel -->
  <g transform="translate(20, 150)">
    <rect x="0" y="0" width="55" height="28" rx="14" fill="#ffffff"/>
    <text x="27" y="18" fill="#0d0d0d" font-size="12" font-weight="700" text-anchor="middle">Все</text>

    <rect x="63" y="0" width="85" height="28" rx="14" fill="#171717" stroke="#2f2f2f"/>
    <text x="105" y="18" fill="#a1a1aa" font-size="12" text-anchor="middle">AI &amp; ML</text>

    <rect x="156" y="0" width="95" height="28" rx="14" fill="#171717" stroke="#2f2f2f"/>
    <text x="203" y="18" fill="#a1a1aa" font-size="12" text-anchor="middle">Хакатоны</text>

    <rect x="259" y="0" width="76" height="28" rx="14" fill="#171717" stroke="#2f2f2f"/>
    <text x="297" y="18" fill="#a1a1aa" font-size="12" text-anchor="middle">Web</text>
  </g>

  <!-- Event Cards list -->
  <g transform="translate(20, 195)">
    <!-- Event Card 1 -->
    <rect width="335" height="245" rx="12" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
    <rect width="335" height="75" rx="12" fill="#212121"/>
    <rect x="15" y="12" width="70" height="20" rx="4" fill="#ffffff"/>
    <text x="50" y="26" fill="#0d0d0d" font-size="10" font-weight="bold" text-anchor="middle">МИТАП</text>
    <text x="15" y="55" fill="#ffffff" font-size="16" font-weight="800">CampusMeet #4: GenAI &amp; Web</text>

    <text x="15" y="96" fill="#ffffff" font-size="12" font-weight="600">15 октября • 17:00 • Ауд. 512 БГУ</text>
    <text x="15" y="116" fill="#a1a1aa" font-size="12">Спикер: В. Громов (Lead Arch)</text>

    <!-- Quota bar -->
    <rect x="15" y="132" width="305" height="6" rx="3" fill="#2a2a2a"/>
    <rect x="15" y="132" width="268" height="6" rx="3" fill="#ffffff"/>
    <text x="15" y="152" fill="#a1a1aa" font-size="10">88/100 мест занято</text>
    <text x="320" y="152" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="end">Осталось 12</text>

    <rect x="15" y="172" width="305" height="42" rx="8" fill="#ffffff"/>
    <text x="167" y="198" fill="#0d0d0d" font-size="13" font-weight="800" text-anchor="middle">Зарегистрироваться в 1 тап</text>

    <!-- Event Card 2 -->
    <g transform="translate(0, 260)">
      <rect width="335" height="235" rx="12" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
      <rect width="335" height="75" rx="12" fill="#212121"/>
      <rect x="15" y="12" width="80" height="20" rx="4" fill="#0d0d0d" stroke="#ffffff"/>
      <text x="55" y="26" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">ХАКАТОН</text>
      <text x="15" y="55" fill="#ffffff" font-size="16" font-weight="800">FPMI Hack 2026 (24h)</text>

      <text x="15" y="96" fill="#ffffff" font-size="12" font-weight="600">24–25 октября • 10:00 • Коворкинг</text>
      <text x="15" y="116" fill="#a1a1aa" font-size="12">Команды по 3-5 чел • Призовой фонд</text>

      <rect x="15" y="132" width="305" height="6" rx="3" fill="#2a2a2a"/>
      <rect x="15" y="132" width="305" height="6" rx="3" fill="#ffffff"/>
      <text x="15" y="152" fill="#ffffff" font-size="10" font-weight="bold">[!] Лимит мест исчерпан</text>
      <text x="320" y="152" fill="#a1a1aa" font-size="10" text-anchor="end">Лист ожидания (+14)</text>

      <rect x="15" y="172" width="305" height="42" rx="8" fill="#212121" stroke="#383838"/>
      <text x="167" y="198" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">В лист ожидания</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar (4 tabs) -->
  <g transform="translate(0, 735)">
    <rect width="375" height="77" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
    
    <text x="48" y="38" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">● Афиша</text>
    <text x="142" y="38" fill="#71717a" font-size="11" text-anchor="middle">Билеты</text>
    <text x="236" y="38" fill="#71717a" font-size="11" text-anchor="middle">Команды</text>
    <text x="328" y="38" fill="#71717a" font-size="11" text-anchor="middle">Профиль</text>
  </g>
</svg>