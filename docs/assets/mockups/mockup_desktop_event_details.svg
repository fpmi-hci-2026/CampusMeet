<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1100" width="1440" height="1100" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Deep Carbon Background -->
  <rect width="1440" height="1100" fill="#0d0d0d"/>

  <!-- Top Glassmorphic Navigation -->
  <rect width="1440" height="72" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
  <g transform="translate(60, 20)">
    <rect width="36" height="36" rx="6" fill="#ffffff"/>
    <text x="18" y="24" fill="#0d0d0d" font-size="16" font-weight="900" text-anchor="middle">CM</text>
    <text x="48" y="25" fill="#ffffff" font-size="18" font-weight="800" letter-spacing="-0.3">CampusMeet</text>
  </g>
  <g transform="translate(260, 36)">
    <text x="0" y="0" fill="#ffffff" font-size="14" font-weight="700">Афиша</text>
    <line x1="0" y1="8" x2="45" y2="8" stroke="#ffffff" stroke-width="2"/>
    <text x="80" y="0" fill="#a1a1aa" font-size="14" font-weight="500">Хакатоны</text>
    <text x="185" y="0" fill="#a1a1aa" font-size="14" font-weight="500">Биржа команд</text>
  </g>
  <circle cx="1380" cy="36" r="18" fill="#212121" stroke="#383838" stroke-width="1.5"/>
  <text x="1380" y="41" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">АК</text>

  <!-- Breadcrumbs & Hero Banner -->
  <g transform="translate(60, 95)">
    <text x="0" y="15" fill="#71717a" font-size="13">Главная / Афиша / CampusMeet #4: Распределенные системы и GenAI</text>

    <!-- Hero Card Container -->
    <rect x="0" y="30" width="1320" height="250" rx="16" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
    
    <!-- Hero Badges -->
    <rect x="40" y="60" width="75" height="24" rx="4" fill="#ffffff"/>
    <text x="77" y="76" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">МИТАП</text>

    <rect x="125" y="60" width="95" height="24" rx="4" fill="#212121" stroke="#383838"/>
    <text x="172" y="76" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">БЕСПЛАТНО</text>

    <rect x="230" y="60" width="145" height="24" rx="4" fill="#212121" stroke="#383838"/>
    <text x="302" y="76" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">ОСТАЛОСЬ 12 МЕСТ</text>

    <!-- Main Title -->
    <text x="40" y="125" fill="#ffffff" font-size="32" font-weight="800" letter-spacing="-0.5">CampusMeet #4: Архитектура распределенных систем и GenAI</text>
    
    <!-- Meta details bar -->
    <text x="40" y="170" fill="#a1a1aa" font-size="14">Четверг, 15 октября 2026 • 17:00 – 20:30 • Главный корпус БГУ, Ауд. 512</text>
    <text x="40" y="200" fill="#71717a" font-size="13">Спикеры: Виктор Громов (Lead Backend Architect) и Александр Белов (AI Research Lead)</text>
  </g>

  <!-- Main Grid: Two columns -->
  <g transform="translate(60, 380)">
    <!-- Left Column (Content & Schedule) -->
    <g transform="translate(0, 0)">
      <rect width="860" height="660" rx="12" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
      
      <!-- Tabs inside event page -->
      <line x1="0" y1="52" x2="860" y2="52" stroke="#2f2f2f"/>
      <text x="30" y="34" fill="#ffffff" font-size="15" font-weight="700">О мероприятии</text>
      <line x1="30" y1="51" x2="140" y2="51" stroke="#ffffff" stroke-width="2.5"/>
      <text x="180" y="34" fill="#a1a1aa" font-size="15">Программа докладов</text>
      <text x="360" y="34" fill="#a1a1aa" font-size="15">Спикеры (3)</text>
      <text x="480" y="34" fill="#a1a1aa" font-size="15">Площадка &amp; Карта</text>
      <text x="640" y="34" fill="#a1a1aa" font-size="15">FAQ и правила</text>

      <!-- Content text placeholders -->
      <g transform="translate(30, 80)">
        <text x="0" y="20" fill="#ffffff" font-size="18" font-weight="bold">Описание митапа</text>
        <text x="0" y="48" fill="#a1a1aa" font-size="14">Практический митап сообщества FPMI IT Club, посвященный современным паттернам highload-систем,</text>
        <text x="0" y="72" fill="#a1a1aa" font-size="14">проектированию событийных микросервисов на Go и внедрению автономных LLM-агентов в продакшен.</text>

        <!-- Interactive Schedule Preview -->
        <text x="0" y="130" fill="#ffffff" font-size="18" font-weight="bold">Таймлайн программы (Tracks)</text>
        
        <!-- Slot 1 -->
        <rect x="0" y="150" width="800" height="75" rx="8" fill="#212121" stroke="#2f2f2f"/>
        <text x="20" y="180" fill="#ffffff" font-size="14" font-weight="700">17:00 - 17:15</text>
        <text x="150" y="180" fill="#ffffff" font-size="15" font-weight="bold">Открытие митапа и вступительное слово</text>
        <text x="150" y="202" fill="#a1a1aa" font-size="12">Максим Романов (Председатель IT-клуба ФПМИ)</text>

        <!-- Slot 2 -->
        <rect x="0" y="235" width="800" height="85" rx="8" fill="#212121" stroke="#2f2f2f"/>
        <text x="20" y="265" fill="#ffffff" font-size="14" font-weight="700">17:15 - 18:00</text>
        <text x="150" y="265" fill="#ffffff" font-size="15" font-weight="bold">Highload в реальном мире: Event-Driven сервисы на Go</text>
        <text x="150" y="287" fill="#a1a1aa" font-size="12">Виктор Громов (Senior Backend Architect) • 40 мин + Q&amp;A</text>
        <rect x="690" y="255" width="95" height="28" rx="6" fill="#2a2a2a" stroke="#383838"/>
        <text x="737" y="274" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">+ В программу</text>

        <!-- Slot 3: Break -->
        <rect x="0" y="330" width="800" height="50" rx="8" fill="#171717" stroke="#383838"/>
        <text x="20" y="360" fill="#ffffff" font-size="14" font-weight="700">18:00 - 18:30</text>
        <text x="150" y="360" fill="#f4f4f4" font-size="14" font-weight="600">Кофе-брейк, пицца и нетворкинг у стендов</text>

        <!-- Slot 4 -->
        <rect x="0" y="390" width="800" height="85" rx="8" fill="#212121" stroke="#2f2f2f"/>
        <text x="20" y="420" fill="#ffffff" font-size="14" font-weight="700">18:30 - 19:20</text>
        <text x="150" y="420" fill="#ffffff" font-size="15" font-weight="bold">Автономные LLM-агенты в продакшене</text>
        <text x="150" y="442" fill="#a1a1aa" font-size="12">Александр Белов (AI Research Lead) • Разбор архитектурных кейсов</text>
      </g>
    </g>

    <!-- Right Column (Sticky Registration & Venue Card) -->
    <g transform="translate(890, 0)">
      <rect width="430" height="660" rx="12" fill="#171717" stroke="#2f2f2f" stroke-width="1"/>
      <g transform="translate(30, 30)">
        <text x="0" y="20" fill="#ffffff" font-size="20" font-weight="800" letter-spacing="-0.3">Регистрация на событие</text>
        <text x="0" y="45" fill="#a1a1aa" font-size="13">Бесплатный электронный билет с QR-кодом</text>

        <!-- Progress bar -->
        <rect x="0" y="65" width="370" height="8" rx="4" fill="#2a2a2a"/>
        <rect x="0" y="65" width="325" height="8" rx="4" fill="#ffffff"/>
        <text x="0" y="95" fill="#a1a1aa" font-size="12">88 из 100 мест занято (88%)</text>
        <text x="370" y="95" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="end">Осталось 12 мест</text>

        <!-- Main Action CTA -->
        <rect x="0" y="115" width="370" height="48" rx="8" fill="#ffffff"/>
        <text x="185" y="145" fill="#0d0d0d" font-size="16" font-weight="bold" text-anchor="middle">Зарегистрироваться (Free)</text>
        <text x="185" y="180" fill="#a1a1aa" font-size="11" text-anchor="middle">[OK] Билет сразу доступен в офлайн-режиме смартфона</text>

        <line x1="0" y1="205" x2="370" y2="205" stroke="#2f2f2f"/>

        <!-- Details block -->
        <text x="0" y="235" fill="#ffffff" font-size="15" font-weight="bold">Дата и время</text>
        <text x="0" y="258" fill="#f4f4f4" font-size="13">Четверг, 15 октября 2026</text>
        <text x="0" y="278" fill="#a1a1aa" font-size="12">17:00 – 20:30 (Сбор гостей с 16:30)</text>

        <text x="0" y="315" fill="#ffffff" font-size="15" font-weight="bold">Локация</text>
        <text x="0" y="338" fill="#f4f4f4" font-size="13">Минск, пр-т Независимости 4</text>
        <text x="0" y="358" fill="#a1a1aa" font-size="12">Главный корпус БГУ, Аудитория 512 (5 этаж)</text>

        <!-- OpenStreetMap Widget -->
        <rect x="0" y="380" width="370" height="130" rx="8" fill="#212121" stroke="#383838"/>
        <text x="185" y="445" fill="#a1a1aa" font-size="13" text-anchor="middle">[Схема проезда / OpenStreetMap: 53.8938, 27.5471]</text>

        <text x="0" y="550" fill="#ffffff" font-size="12" font-weight="600">↓ Добавить в Google Calendar / Apple iCal</text>
      </g>
    </g>
  </g>
</svg>