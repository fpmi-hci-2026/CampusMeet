      <!-- Security Countdown -->
      <g transform="translate(178, 365)">
        <text x="0" y="0" font-size="11" font-weight="700" fill="#6366f1" text-anchor="middle">HMAC SHA-256: Обновление через 18 сек</text>
        <text x="0" y="20" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">TKT-88F4-019B-SHA256</text>
      </g>

      <!-- Offline Cache Status -->
      <g transform="translate(18, 415)">
        <rect width="321" height="32" rx="6" fill="#141414" stroke="#222222" stroke-width="1"/>
        <g transform="translate(12,8)" stroke="#10b981" fill="none" stroke-width="1.5">
          <path d="M8 2L3 4v4.5c0 3.5 2.5 5.5 5 6.5 2.5-1 5-3 5-6.5V4L8 2z"/>
        </g>
        <text x="35" y="20" font-size="10" font-weight="600" fill="#e5e5e5">Offline-First кеш подтвержден криптографически</text>
      </g>
    </g>

    <!-- Pass Wallet Action Button -->
    <g transform="translate(18, 615)">
      <rect width="357" height="46" rx="10" fill="#0d0d0d" stroke="#333333" stroke-width="1.2"/>
      <text x="178" y="28" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Сохранить в Google / Apple Wallet</text>
    </g>

    <!-- Navigation Bar: 4 Strictly Centered Tabs -->
    <g transform="translate(16, 772)">
      <rect width="361" height="56" rx="18" fill="#0d0d0d" stroke="#222222" stroke-width="1.2"/>
      
      <!-- Tab 1: Афиша -->
      <g transform="translate(45.1, 12)">
        <g transform="translate(-8,0)" stroke="#888888" fill="none" stroke-width="1.5">
          <rect x="2" y="3" width="12" height="11" rx="2"/>
          <line x1="2" y1="6.5" x2="14" y2="6.5"/>
          <line x1="5" y1="1.5" x2="5" y2="4"/>
          <line x1="11" y1="1.5" x2="11" y2="4"/>
        </g>
        <text x="0" y="30" font-size="10" font-weight="500" fill="#888888" text-anchor="middle">Афиша</text>
      </g>

      <!-- Tab 2: Билет (Active) -->
      <g transform="translate(135.4, 8)">
        <rect x="-24" y="0" width="48" height="26" rx="13" fill="rgba(99, 102, 241, 0.2)"/>
        <g transform="translate(-8,5)" fill="#818cf8">
