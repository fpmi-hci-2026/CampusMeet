          <path d="M6.5 13a1.5 1.5 0 0 0 3 0"/>
        </g>
        <circle cx="22" cy="8" r="3.5" fill="#ef4444"/>

        <!-- Profile Avatar Pill -->
        <circle cx="48" cy="16" r="15" fill="#6366f1"/>
        <text x="48" y="21" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">АК</text>
      </g>
    </g>

    <!-- Authenticated Ticket Card (True Black #0d0d0d) -->
    <g transform="translate(18, 108)">
