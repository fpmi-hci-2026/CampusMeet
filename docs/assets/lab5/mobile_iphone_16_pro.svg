<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 473 932" width="473" height="932" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  
  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Subtle Button Shadow -->
    <filter id="shadow-btn" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Modal Elevation Shadow -->
    <filter id="shadow-modal" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.60"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glowing Accent -->
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="grad-card-true-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <linearGradient id="grad-device-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>


  <!-- True Black Canvas -->
  <rect width="473" height="932" fill="#000000"/>

  <!-- Device Label -->
  <text x="236" y="28" font-size="13" font-weight="700" fill="#888888" text-anchor="middle">Apple iPhone 16 Pro (393×852 pt) • iOS 18</text>

  <!-- Hardware Chassis Outer (Pure Dark Titanium / Neutral) -->
  <g transform="translate(40, 40)">
    <rect width="393" height="852" rx="48" fill="#141414" stroke="#2a2a2a" stroke-width="2.5" filter="url(#shadow-modal)"/>
    <rect x="8" y="8" width="377" height="836" rx="40" fill="#000000"/>

    
    
        <!-- Dynamic Island -->
        <rect x="134" y="14" width="124" height="32" rx="16" fill="#0a0a0a"/>
        <circle cx="236" cy="30" r="5" fill="#1a1a1a"/>
        <circle cx="151" cy="30" r="4" fill="#22c55e"/>
        

    <!-- Status Bar -->
    <text x="36" y="34" font-size="12" font-weight="700" fill="#ffffff">9:41</text>
    <g transform="translate(328, 24)">
      <rect x="0" y="7" width="2" height="3" fill="#ffffff"/>
      <rect x="3" y="5" width="2" height="5" fill="#ffffff"/>
      <rect x="6" y="3" width="2" height="7" fill="#ffffff"/>
      <rect x="9" y="0" width="2" height="10" fill="#ffffff"/>
      <!-- Battery -->
      <rect x="16" y="0" width="16" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1"/>
      <rect x="18" y="2" width="10" height="5" rx="1" fill="#22c55e"/>
    </g>

    <!-- App Header & User Avatar Profile -->
    <g transform="translate(20, 60)">
      <rect width="32" height="32" rx="8" fill="#6366f1"/>
      <text x="16" y="21" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">CM</text>
      
      <text x="42" y="16" font-size="14" font-weight="800" fill="#ffffff">Мой билет</text>
      <text x="42" y="29" font-size="10" fill="#888888">ФПМИ БГУ • Профиль Артёма</text>

      <!-- Right Action Icons: Bell + Profile Avatar -->
      <g transform="translate(283, 0)">
        <circle cx="16" cy="16" r="14" fill="#0d0d0d" stroke="#222222" stroke-width="1"/>
        <g transform="translate(8,8)" stroke="#ffffff" fill="none" stroke-width="1.5">
