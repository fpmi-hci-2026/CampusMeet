      <circle cx="0" cy="140" r="12" fill="#000000"/>
      <circle cx="357" cy="140" r="12" fill="#000000"/>
      <line x1="16" y1="140" x2="341" y2="140" stroke="#222222" stroke-width="1.5" stroke-dasharray="6 4"/>

