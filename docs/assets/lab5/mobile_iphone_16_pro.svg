      <rect x="16" y="16" width="95" height="22" rx="4" fill="rgba(255, 255, 255, 0.08)"/>
      <text x="63" y="31" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">ДОСТУП АКТИВЕН</text>
      
      <text x="16" y="65" font-size="18" font-weight="800" fill="#ffffff">Minsk Go Meetup #14</text>
      <text x="16" y="88" font-size="11" fill="#888888">26 марта 2026 • 18:30 • Ауд. 509 ФПМИ</text>
      <text x="16" y="106" font-size="11" font-weight="600" fill="#818cf8">Ряд 4, Место 12 • Студенческая квота</text>

