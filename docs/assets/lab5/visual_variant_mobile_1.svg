    <!-- Live HMAC SHA-256 Security Token & Circular Progress -->
    <g transform="translate(185, 395)">
      <circle cx="-95" cy="0" r="10" fill="none" stroke="#cbd5e1" stroke-width="2.5"/>
      <path d="M -95 -10 A 10 10 0 1 1 -105 0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <text x="-95" y="3.5" font-size="7" font-weight="800" fill="#2563eb" text-anchor="middle">18</text>

      <text x="-75" y="4" font-size="11" font-weight="700" fill="#2563eb">HMAC-SHA256: Обновление через 18 сек</text>
      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">TKT-88F4-019B-SHA256</text>
    </g>

    <!-- Offline Resilience Badge -->
    <g transform="translate(35, 450)">
      <rect width="300" height="34" rx="8" fill="#f1f5f9"/>
      <g transform="translate(15,9)" stroke="#0f172a" fill="none" stroke-width="1.5">
