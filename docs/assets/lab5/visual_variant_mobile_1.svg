    <rect width="34" height="34" rx="8" fill="#2563eb"/>
    <text x="17" y="23" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle">CM</text>
    
    <text x="46" y="23" font-size="18" font-weight="800" fill="#0f172a">Мой билет</text>
    
