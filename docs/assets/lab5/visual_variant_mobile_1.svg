<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="420" height="900" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  
  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Subtle Button Shadow -->
    <filter id="shadow-btn" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Modal Elevation Shadow -->
    <filter id="shadow-modal" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.60"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glowing Accent -->
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="grad-card-true-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <linearGradient id="grad-device-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>


  <!-- Device Outer Hardware Frame -->
  <rect width="420" height="900" rx="48" fill="#1e293b" stroke="#333333" stroke-width="2.5" filter="url(#shadow-modal)"/>
  <rect x="12" y="12" width="396" height="876" rx="40" fill="#f8fafc"/>

  <!-- Dynamic Island -->
  <rect x="148" y="22" width="124" height="32" rx="16" fill="#000000"/>
  <circle cx="250" cy="38" r="5" fill="#1e1e1e"/>
  <circle cx="165" cy="38" r="4" fill="#22c55e"/>

  <!-- Status Bar -->
  <text x="44" y="44" font-size="13" font-weight="700" fill="#0f172a">9:41</text>
  <g transform="translate(340, 34)">
    <rect x="0" y="8" width="2.5" height="4" rx="0.5" fill="#0f172a"/>
    <rect x="4" y="6" width="2.5" height="6" rx="0.5" fill="#0f172a"/>
