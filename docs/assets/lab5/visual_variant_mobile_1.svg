    <rect x="22" y="3" width="12" height="6" rx="1" fill="#22c55e"/>
    <path d="M39 4v4" stroke="#0f172a" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- App Header with Profile Avatar -->
