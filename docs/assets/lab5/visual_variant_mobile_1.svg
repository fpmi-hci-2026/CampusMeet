    <rect width="370" height="48" rx="12" fill="#000000" stroke="#333333" stroke-width="1.2" filter="url(#shadow-btn)"/>
    <text x="185" y="29" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Добавить в Apple Wallet</text>
  </g>

  <!-- Quick Shortcut Button -->
  <g transform="translate(25, 725)">
    <rect width="370" height="48" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="185" y="29" font-size="13" font-weight="700" fill="#0f172a" text-anchor="middle">Маршрут в ауд. 509 (Схема корпуса)</text>
  </g>

  <!-- Bottom Navigation Tab Bar (4 Balanced Tabs) -->
