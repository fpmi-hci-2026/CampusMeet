<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  
  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Subtle Button Shadow -->
    <filter id="shadow-btn" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Modal Elevation Shadow -->
    <filter id="shadow-modal" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.60"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glowing Accent -->
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="grad-card-true-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <linearGradient id="grad-device-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>


  <rect width="1440" height="900" fill="#f8fafc"/>

  <!-- Info Header -->
  
  <g transform="translate(40, 30)">
    <rect width="1360" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>
    <text x="25" y="28" font-size="16" font-weight="800" fill="#0f172a">Модульная сетка: 1440px (Десктоп большой)</text>
    <text x="25" y="50" font-size="12" fill="#64748b">W = N×W_col + (N-1)×G + 2M  ==>  1440px = 12×88 + 11×24 + 120px</text>
    <rect x="1120" y="20" width="220" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1230" y="40" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Контейнер: 1320px | Gutter: 24px</text>
  </g>

  <!-- Viewport Boundary -->
  <rect x="0" y="115" width="1440" height="700" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow-card)"/>

  <!-- Grid Columns & Gutters -->
  <rect x="60" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="172" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="284" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="396" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="508" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="620" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="732" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="844" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="956" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="1068" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="1180" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="1292" y="125" width="88" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/>
  <rect x="148" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="260" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="372" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="484" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="596" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="708" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="820" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="932" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="1044" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="1156" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="1268" y="125" width="24" height="680" fill="rgba(239, 68, 68, 0.06)"/>
  <text x="104" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">1</text><text x="104" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="216" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">2</text><text x="216" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="328" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">3</text><text x="328" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="440" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">4</text><text x="440" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="552" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">5</text><text x="552" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="664" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">6</text><text x="664" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="776" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">7</text><text x="776" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="888" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">8</text><text x="888" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="1000" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">9</text><text x="1000" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="1112" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">10</text><text x="1112" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="1224" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">11</text><text x="1224" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text><text x="1336" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">12</text><text x="1336" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">88px</text>

  <!-- Simulated Snapped Content Layer -->
  <g transform="translate(60, 160)">
    
    <!-- Navigation (12 cols) -->
    <rect width="1320" height="45" rx="8" fill="#0f172a"/>
    <text x="20" y="28" font-size="14" font-weight="800" fill="#ffffff">CampusMeet</text>
    <text x="1300" y="28" font-size="12" fill="#94a3b8" text-anchor="end">Афиша • Хакатоны • Мой билет</text>

    <!-- Hero Banner (8 cols) -->
    <g transform="translate(0, 60)">
