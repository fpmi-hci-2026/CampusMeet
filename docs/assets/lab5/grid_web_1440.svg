      <text x="15" y="125" font-size="12" fill="#475569">Высоконагруженные сервисы</text>
      <rect x="15" y="200" width="394" height="36" rx="6" fill="#0f172a"/>
      <text x="212" y="223" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Забронировать</text>
    </g>

