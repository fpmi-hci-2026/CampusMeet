      <text x="20" y="35" font-size="14" font-weight="800" fill="#0f172a">Мой активный билет</text>
      <text x="20" y="60" font-size="11" fill="#64748b">Minsk Go Meetup #14</text>
      <rect x="20" y="85" width="100" height="26" rx="4" fill="#ecfdf5"/>
      <text x="70" y="102" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">✓ Вход открыт</text>
    </g>

    <!-- 3 Bento Event Cards (4 cols each) -->
    <g transform="translate(0, 230)">
      <rect width="424" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="424" height="90" rx="10" fill="#1e293b"/>
      <text x="15" y="40" font-size="14" font-weight="700" fill="#ffffff">Minsk Go Meetup</text>
