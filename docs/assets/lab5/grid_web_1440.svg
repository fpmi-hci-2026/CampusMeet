      <rect width="424" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="424" height="90" rx="10" fill="#312e81"/>
      <text x="15" y="40" font-size="14" font-weight="700" fill="#ffffff">AI Hackathon</text>
      <text x="15" y="62" font-size="11" fill="#c7d2fe">29-30 марта • 24ч</text>
      <text x="15" y="125" font-size="12" fill="#475569">Мультиагентные системы</text>
      <rect x="15" y="200" width="394" height="36" rx="6" fill="#4338ca"/>
      <text x="212" y="223" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Подать заявку</text>
    </g>

    <g transform="translate(920, 230)">
      <rect width="424" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="424" height="90" rx="10" fill="#78350f"/>
      <text x="15" y="40" font-size="14" font-weight="700" fill="#ffffff">DevOps Workshop</text>
