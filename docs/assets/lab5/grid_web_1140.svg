<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  
  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Subtle Button Shadow -->
    <filter id="shadow-btn" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Modal Elevation Shadow -->
    <filter id="shadow-modal" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.60"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glowing Accent -->
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="grad-card-true-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <linearGradient id="grad-device-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>


  <rect width="1200" height="850" fill="#f8fafc"/>

  <!-- Info Header -->
  
  <g transform="translate(40, 30)">
    <rect width="1120" height="70" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>
    <text x="25" y="28" font-size="16" font-weight="800" fill="#0f172a">Модульная сетка: 992–1199px (Десктоп ноутбук / 1140 Grid)</text>
    <text x="25" y="50" font-size="12" fill="#64748b">W = N×W_col + (N-1)×G + 2M  ==>  1140px = 12×84 + 11×12 + 0px</text>
    <rect x="880" y="20" width="220" height="30" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="990" y="40" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">Контейнер: 1140px | Gutter: 12px</text>
  </g>

  <!-- Viewport Boundary -->
  <rect x="30" y="115" width="1140" height="700" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow-card)"/>

  <!-- Grid Columns & Gutters -->
  <rect x="30" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="126" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="222" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="318" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="414" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="510" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="606" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="702" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="798" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="894" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="990" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="1086" y="125" width="84" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/>
  <rect x="114" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="210" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="306" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="402" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="498" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="594" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="690" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="786" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="882" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="978" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="1074" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/>
  <text x="72" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">1</text><text x="72" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="168" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">2</text><text x="168" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="264" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">3</text><text x="264" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="360" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">4</text><text x="360" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="456" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">5</text><text x="456" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="552" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">6</text><text x="552" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="648" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">7</text><text x="648" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="744" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">8</text><text x="744" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="840" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">9</text><text x="840" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="936" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">10</text><text x="936" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="1032" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">11</text><text x="1032" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text><text x="1128" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">12</text><text x="1128" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">84px</text>

  <!-- Simulated Snapped Content Layer -->
  <g transform="translate(30, 160)">
    
    <!-- Navigation (12 cols) -->
    <rect width="1140" height="45" rx="8" fill="#0f172a"/>
    <text x="20" y="28" font-size="14" font-weight="800" fill="#ffffff">CampusMeet</text>
    <text x="1120" y="28" font-size="12" fill="#94a3b8" text-anchor="end">Афиша • Хакатоны • Мой билет</text>

    <!-- Hero Banner (8 cols) -->
    <g transform="translate(0, 60)">
      <rect width="756" height="150" rx="10" fill="#6366f1"/>
      <text x="25" y="40" font-size="18" font-weight="800" fill="#ffffff">Студенческие митапы и хакатоны</text>
      <text x="25" y="70" font-size="12" fill="#e0e7ff">Единая экосистема регистрации на события ФПМИ БГУ.</text>
      <rect x="25" y="95" width="130" height="34" rx="6" fill="#ffffff"/>
      <text x="90" y="117" font-size="11" font-weight="700" fill="#4338ca" text-anchor="middle">Афиша событий</text>
    </g>

    <!-- Side Action Card (4 cols) -->
    <g transform="translate(768, 60)">
      <rect width="372" height="150" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="20" y="35" font-size="14" font-weight="800" fill="#0f172a">Мой активный билет</text>
      <text x="20" y="60" font-size="11" fill="#64748b">Minsk Go Meetup #14</text>
      <rect x="20" y="85" width="100" height="26" rx="4" fill="#ecfdf5"/>
      <text x="70" y="102" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">✓ Вход открыт</text>
    </g>

    <!-- 3 Bento Event Cards (4 cols each) -->
    <g transform="translate(0, 230)">
      <rect width="372" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="372" height="90" rx="10" fill="#1e293b"/>
      <text x="15" y="40" font-size="14" font-weight="700" fill="#ffffff">Minsk Go Meetup</text>
      <text x="15" y="62" font-size="11" fill="#94a3b8">26 марта • 18:30</text>
      <text x="15" y="125" font-size="12" fill="#475569">Высоконагруженные сервисы</text>
      <rect x="15" y="200" width="342" height="36" rx="6" fill="#0f172a"/>
      <text x="186" y="223" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Забронировать</text>
    </g>

    <g transform="translate(384, 230)">
      <rect width="372" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="372" height="90" rx="10" fill="#312e81"/>
      <text x="15" y="40" font-size="14" font-weight="700" fill="#ffffff">AI Hackathon</text>
      <text x="15" y="62" font-size="11" fill="#c7d2fe">29-30 марта • 24ч</text>
      <text x="15" y="125" font-size="12" fill="#475569">Мультиагентные системы</text>
      <rect x="15" y="200" width="342" height="36" rx="6" fill="#4338ca"/>
      <text x="186" y="223" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Подать заявку</text>
    </g>

    <g transform="translate(780, 230)">
      <rect width="372" height="260" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="372" height="90" rx="10" fill="#78350f"/>
      <text x="15" y="40" font-size="14" font-weight="700" fill="#ffffff">DevOps Workshop</text>
      <text x="15" y="62" font-size="11" fill="#fde68a">3 апреля • 17:00</text>
      <text x="15" y="125" font-size="12" fill="#475569">Кластерная безопасность</text>
      <rect x="15" y="200" width="342" height="36" rx="6" fill="#ea580c"/>
      <text x="186" y="223" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Занять место</text>
    </g>
