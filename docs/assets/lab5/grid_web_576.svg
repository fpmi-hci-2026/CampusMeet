<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 850" width="620" height="850" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  
  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.30"/>
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000000" flood-opacity="0.15"/>
    </filter>

    <!-- Subtle Button Shadow -->
    <filter id="shadow-btn" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Modal Elevation Shadow -->
    <filter id="shadow-modal" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.60"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <!-- Glowing Accent -->
    <filter id="glow-accent" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Gradients -->
    <linearGradient id="grad-indigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="grad-warm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="grad-mono" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="grad-card-true-black" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>

    <linearGradient id="grad-device-titanium" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>


  <rect width="620" height="850" fill="#f8fafc"/>

  <!-- Info Header -->
  
  <g transform="translate(20, 20)">
    <rect width="580" height="80" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="15" y="25" font-size="13" font-weight="800" fill="#0f172a">576–767px (Фаблет / 6 колонок)</text>
    <text x="15" y="45" font-size="11" fill="#475569">6 кол. × 80px | Gutter: 12px | Поля: 18px</text>
    <text x="15" y="65" font-size="10" font-family="'JetBrains Mono', monospace" fill="#6366f1">576px = 6×80 + 5×12 + 36px</text>
  </g>

  <!-- Viewport Boundary -->
  <rect x="22" y="115" width="576" height="700" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="2" filter="url(#shadow-card)"/>

  <!-- Grid Columns & Gutters -->
  <rect x="40" y="125" width="80" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="132" y="125" width="80" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="224" y="125" width="80" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="316" y="125" width="80" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="408" y="125" width="80" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/><rect x="500" y="125" width="80" height="680" fill="rgba(99, 102, 241, 0.08)" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1"/>
  <rect x="120" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="212" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="304" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="396" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/><rect x="488" y="125" width="12" height="680" fill="rgba(239, 68, 68, 0.06)"/>
  <text x="80" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">1</text><text x="80" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">80px</text><text x="172" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">2</text><text x="172" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">80px</text><text x="264" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">3</text><text x="264" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">80px</text><text x="356" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">4</text><text x="356" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">80px</text><text x="448" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">5</text><text x="448" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">80px</text><text x="540" y="142" font-size="10" font-weight="700" fill="#6366f1" text-anchor="middle">6</text><text x="540" y="795" font-size="9" font-weight="600" fill="#6366f1" text-anchor="middle">80px</text>

  <!-- Simulated Snapped Content Layer -->
  <g transform="translate(40, 160)">
    
    <!-- Phablet 6 cols -->
    <rect width="540" height="40" rx="6" fill="#0f172a"/>
    <text x="15" y="25" font-size="12" font-weight="800" fill="#ffffff">CampusMeet</text>
    <rect x="510" y="12" width="18" height="15" rx="3" fill="#334155"/>

    <!-- Single Stacked Event Card (6 cols full width) -->
    <g transform="translate(0, 52)">
      <rect width="540" height="280" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <rect width="540" height="80" rx="8" fill="#1e293b"/>
      <text x="15" y="35" font-size="14" font-weight="800" fill="#ffffff">Minsk Go Meetup #14</text>
      <text x="15" y="58" font-size="11" fill="#94a3b8">26 марта • 18:30 • Ауд. 509 ФПМИ</text>
      
      <text x="15" y="115" font-size="12" fill="#334155">Высоконагруженные микросервисы и gRPC.</text>
      <rect x="15" y="140" width="140" height="24" rx="4" fill="#eff6ff"/>
      <text x="85" y="156" font-size="10" font-weight="700" fill="#1d4ed8" text-anchor="middle">Спикер: А. Смирнов</text>

      <rect x="15" y="215" width="510" height="40" rx="6" fill="#0f172a"/>
      <text x="270" y="240" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Забронировать билет</text>
    </g>
  </g>
</svg>