<rect x="506" y="284.0" width="36" height="16" rx="3" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
<text x="524" y="296.0" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">80%</text>
<polygon points="500.0,255.0 660.2,347.5 660.2,532.5 500.0,625.0 339.8,532.5 339.8,347.5" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="none"/>
