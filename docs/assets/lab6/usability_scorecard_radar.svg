<polygon points="500.0,282.8 628.2,366.0 644.2,523.2 500.0,578.8 387.8,504.8 379.8,370.6" fill="none" stroke="#d97706" stroke-width="2.2" stroke-dasharray="6 3"/>
<polygon points="500.0,259.6 642.6,357.7 649.0,526.0 500.0,598.7 357.7,522.1 353.9,355.6" fill="url(#actualGrad)" stroke="#2563eb" stroke-width="2.8"/>
<circle cx="500.0" cy="259.6" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow-badge)"/>
<circle cx="642.6" cy="357.7" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow-badge)"/>
<circle cx="649.0" cy="526.0" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow-badge)"/>
<circle cx="500.0" cy="598.7" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow-badge)"/>
<circle cx="357.7" cy="522.1" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow-badge)"/>
<circle cx="353.9" cy="355.6" r="5.5" fill="#2563eb" stroke="#ffffff" stroke-width="2.5" filter="url(#shadow-badge)"/>
<g transform="translate(500, 219)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Успешность (Task Success)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">97.5% <tspan fill="#64748b" font-weight="400">(Эталон: 85%) [+12.5%]</tspan></text>
</g>
<g transform="translate(695, 335)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">Скорость (Time Efficiency)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="start">89.0% <tspan fill="#64748b" font-weight="400">(Эталон: 80%) [+9.0%]</tspan></text>
</g>
<g transform="translate(695, 545)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="start">Безошибочность (Error-Free)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="start">93.0% <tspan fill="#64748b" font-weight="400">(Эталон: 90%) [+3.0%]</tspan></text>
</g>
<g transform="translate(500, 673)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Удовлетворённость (SUS Score)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">85.8% <tspan fill="#64748b" font-weight="400">(Эталон: 75%) [+10.8%]</tspan></text>
</g>
<g transform="translate(305, 545)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">Прямизна путей (Treejack)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="end">88.8% <tspan fill="#64748b" font-weight="400">(Эталон: 70%) [+18.8%]</tspan></text>
</g>
<g transform="translate(305, 335)">
  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="end">Эргономика ввода (GOMS)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="end">91.2% <tspan fill="#64748b" font-weight="400">(Эталон: 75%) [+16.2%]</tspan></text>
</g>
<g transform="translate(50, 716)">
  <rect x="0" y="0" width="900" height="28" rx="6" fill="#f1f5f9"/>
  <text x="14" y="18" font-size="11.5" fill="#475569">💡 <tspan font-weight="700" fill="#0f172a">Вывод Usability Scorecard:</tspan> Все 6 показателей выше эталона (+11.5 п.п. в среднем). Лидируют успешность (97.5%) и безошибочность (93.0%).</text>
</g>
</svg>