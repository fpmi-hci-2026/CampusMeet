<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">

  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>

    <filter id="shadow-badge" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <!-- Radar Gradients -->
    <linearGradient id="actualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bar-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

<rect width="100%" height="100%" fill="#f8fafc"/>
<rect x="24" y="24" width="952" height="712" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>
<g transform="translate(50, 60)">
  <text x="0" y="0" font-size="20" font-weight="800" fill="#0f172a">Сводная лепестковая диаграмма юзабилити (Usability Scorecard)</text>
  <text x="0" y="24" font-size="12" fill="#64748b">Сопоставление фактических показателей CampusMeet с целевым эталоном (N = 10, 95% ДИ Вильсона, SUM = 90.7%)</text>
</g>
<g transform="translate(50, 105)">
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <rect x="14" y="12" width="10" height="10" rx="2" fill="#2563eb"/>
    <text x="32" y="22" font-size="12" font-weight="700" fill="#1e40af">CampusMeet (Факт) — среднее 90.7%</text>
  </g>
  <g transform="translate(295, 0)">
    <rect x="0" y="0" width="310" height="34" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <line x1="14" y1="17" x2="30" y2="17" stroke="#d97706" stroke-width="2.5" stroke-dasharray="4 2"/>
    <text x="38" y="22" font-size="12" font-weight="700" fill="#92400e">Целевой отраслевой эталон — 79.2%</text>
  </g>
  <g transform="translate(620, 0)">
    <rect x="0" y="0" width="280" height="34" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="140" y="22" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">★ Превышение эталона: +11.5 п.п.</text>
  </g>
</g>
