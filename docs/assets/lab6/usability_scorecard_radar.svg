<text x="524" y="259.0" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">100%</text>
<line x1="500" y1="440" x2="500.0" y2="255.0" stroke="#cbd5e1" stroke-width="1.2"/>
