  <text x="0" y="0" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Успешность (Task Success)</text>
  <text x="0" y="16" font-family="JetBrains Mono, monospace" font-size="11" font-weight="700" fill="#059669" text-anchor="middle">97.5% <tspan fill="#64748b" font-weight="500">(Эталон: 85%)</tspan> <tspan fill="#10b981" font-size="10">[+12.5%]</tspan></text>
</g>
