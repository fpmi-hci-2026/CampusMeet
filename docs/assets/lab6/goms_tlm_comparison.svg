<text x="546.7" y="462" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[10T + 8K]</text>
<text x="278" y="484" font-size="11" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (Omnibox Мышь)</text>
