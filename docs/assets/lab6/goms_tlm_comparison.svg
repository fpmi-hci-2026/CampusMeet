<text x="473.3" y="358" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[3M + 2P + 4K]</text>
<text x="278" y="380" font-size="11" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (SSO + 1-Click)</text>
