<text x="633.0" y="380" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[16T + 24K + 1M]</text>
<text x="296" y="404" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (SSO + Мышь)</text>
<rect x="310" y="391" width="107.0" height="18" rx="4" fill="url(#bar-blue)"/>
<text x="426.9" y="404" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">9.30 с</text>
<text x="490.9" y="404" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[3M + 2P + 4K]</text>
<text x="296" y="428" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (SSO + 1-Click)</text>
<rect x="310" y="415" width="55.8" height="18" rx="4" fill="url(#bar-green)"/>
<text x="375.8" y="428" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">4.85 с</text>
<text x="439.8" y="428" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[1M + 1K (Enter)]</text>
<g transform="translate(50, 465)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Форма 3: Поиск и фильтрация</text>
  <rect x="214.5" y="-12" width="237" height="20" rx="4" fill="#ecfdf5"/>
  <text x="333.0" y="2" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Ускорение: в 3.54 раза (-71.7%)</text>
</g>
<text x="296" y="490" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. А (Мышь, дропдауны)</text>
<rect x="310" y="477" width="284.6" height="18" rx="4" fill="url(#bar-red)"/>
<text x="604.6" y="490" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">24.75 с</text>
<text x="668.6" y="490" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[9M + 6P + 8K]</text>
<text x="296" y="514" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. А (Tab по селектам)</text>
<rect x="310" y="501" width="178.8" height="18" rx="4" fill="url(#bar-orange)"/>
