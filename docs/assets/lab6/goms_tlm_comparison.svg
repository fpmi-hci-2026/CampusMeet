<text x="680.1" y="188" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">32.35 с</text>
<text x="744.1" y="188" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[11M + 8P + 11K]</text>
