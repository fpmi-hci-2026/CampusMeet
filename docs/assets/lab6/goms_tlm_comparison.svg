<g transform="translate(54, 542)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Мобильное приложение (Touch Level Model, TLM)</text>
  <rect x="236" y="-12" width="225" height="20" rx="4" fill="#f5f3ff"/>
  <text x="348.4" y="2" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Сенсорный ввод: 3.85 – 6.10 с</text>
</g>
<text x="278" y="566" font-size="11" font-weight="500" fill="#475569" text-anchor="end">Экран 1: SSO Вход (BSU ID)</text>
<rect x="290" y="554" width="45.2" height="17" rx="4" fill="url(#bar-purple)"/>
<text x="345.2" y="566" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">3.85 с</text>
<text x="409.2" y="566" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[1T_init + 1Tap + 1FaceID]</text>
<text x="278" y="588" font-size="11" font-weight="500" fill="#475569" text-anchor="end">Экран 2: QR Билет (Офлайн)</text>
<rect x="290" y="576" width="71.7" height="17" rx="4" fill="url(#bar-purple)"/>
<text x="371.7" y="588" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">6.10 с</text>
<text x="435.7" y="588" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[2Tap + 1Scroll + 1HMAC]</text>
<text x="278" y="610" font-size="11" font-weight="500" fill="#475569" text-anchor="end">Экран 3: Сканер допуска волонтёра</text>
<rect x="290" y="598" width="54.6" height="17" rx="4" fill="url(#bar-purple)"/>
<text x="354.6" y="610" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">4.65 с</text>
<text x="418.6" y="610" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[1Tap + 1CamFocus + 1Haptic]</text>
<g transform="translate(54, 716)">
  <rect x="0" y="0" width="892" height="28" rx="6" fill="#f1f5f9"/>
  <text x="14" y="18" font-size="11" fill="#475569">⚡ <tspan font-weight="600" fill="#0f172a">Итог GOMS:</tspan> Вариант Б сокращает время ввода до 4.85 с при регистрации и 14.10 с при создании митапа, подтверждая тезис о превосходстве чип-компоновок над глубокими селектами.</text>
