<text x="597.2" y="270" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">24.10 с</text>
<text x="661.2" y="270" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[7M + 5P + 11K]</text>
<text x="296" y="294" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (Tab + Ctrl+Enter)</text>
<rect x="310" y="281" width="162.1" height="18" rx="4" fill="url(#bar-green)"/>
<text x="482.1" y="294" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">14.10 с</text>
<text x="546.1" y="294" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[8T + 11K + 1Chord]</text>
<g transform="translate(50, 331)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Форма 2: Регистрация участника</text>
  <rect x="237.0" y="-12" width="237" height="20" rx="4" fill="#ecfdf5"/>
  <text x="355.5" y="2" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Ускорение: в 7.86 раза (-87.3%)</text>
</g>
<text x="296" y="356" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. А (Мышь, 6 инпутов)</text>
