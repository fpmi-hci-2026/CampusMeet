<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 800" width="100%" height="auto" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif">

  <defs>
    <!-- Drop Shadow Standard -->
    <filter id="shadow-card" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.07"/>
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.03"/>
    </filter>

    <filter id="shadow-badge" x="-10%" y="-15%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>

    <!-- Radar Gradients -->
    <linearGradient id="actualGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.18"/>
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="bar-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bar-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="bar-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

<rect width="100%" height="100%" fill="#f8fafc"/>
<rect x="24" y="24" width="992" height="752" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow-card)"/>
<g transform="translate(50, 60)">
  <text x="0" y="0" font-size="20" font-weight="800" fill="#0f172a">Моторно-когнитивный хронометраж: GOMS (Web) vs TLM (Mobile)</text>
  <text x="0" y="24" font-size="12" fill="#64748b">Аналитическое моделирование операций (Card, Moran, Newell). Сокращение времени в 1.55–7.86 раза при оптимизации компоновки.</text>
</g>
<g transform="translate(50, 105)">
  <g transform="translate(0, 0)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#ef4444"/>
    <text x="18" y="10" font-size="11.5" font-weight="600" fill="#334155">Вар. А (Мышь)</text>
  </g>
  <g transform="translate(170, 0)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#f97316"/>
    <text x="18" y="10" font-size="11.5" font-weight="600" fill="#334155">Вар. А (Tab-ввод)</text>
  </g>
  <g transform="translate(355, 0)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#3b82f6"/>
    <text x="18" y="10" font-size="11.5" font-weight="600" fill="#334155">Вар. Б (Мышь)</text>
  </g>
  <g transform="translate(525, 0)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#10b981"/>
    <text x="18" y="10" font-size="11.5" font-weight="600" fill="#334155">Вар. Б (Tab / Fast)</text>
  </g>
  <g transform="translate(710, 0)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#8b5cf6"/>
    <text x="18" y="10" font-size="11.5" font-weight="600" fill="#334155">TLM Mobile Touch</text>
  </g>
</g>
<line x1="425.0" y1="175" x2="425.0" y2="735" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="425.0" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">10 с</text>
<line x1="540.0" y1="175" x2="540.0" y2="735" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="540.0" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">20 с</text>
<line x1="655.0" y1="175" x2="655.0" y2="735" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="655.0" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">30 с</text>
<line x1="770.0" y1="175" x2="770.0" y2="735" stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="770.0" y="170" font-family="JetBrains Mono, monospace" font-size="10" fill="#94a3b8" text-anchor="middle">40 с</text>
<g transform="translate(50, 197)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Форма 1: Создание митапа / CFP</text>
  <rect x="237.0" y="-12" width="237" height="20" rx="4" fill="#ecfdf5"/>
  <text x="355.5" y="2" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Ускорение: в 2.29 раза (-56.4%)</text>
</g>
<text x="296" y="222" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. А (Мышь)</text>
<rect x="310" y="209" width="372.0" height="18" rx="4" fill="url(#bar-red)"/>
<text x="692.0" y="222" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">32.35 с</text>
<text x="756.0" y="222" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[11M + 8P + 11K]</text>
