<text x="562.8" y="514" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[10T + 8K]</text>
<text x="296" y="538" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (Omnibox Мышь)</text>
<rect x="310" y="525" width="138.6" height="18" rx="4" fill="url(#bar-blue)"/>
<text x="458.6" y="538" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">12.05 с</text>
<text x="522.6" y="538" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[4M + 2P + 6K]</text>
<text x="296" y="562" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Вар. Б (Omnibox ⌘K + Tab)</text>
<rect x="310" y="549" width="80.5" height="18" rx="4" fill="url(#bar-green)"/>
<text x="400.5" y="562" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">7.00 с</text>
<text x="464.5" y="562" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[1Chord + 6K + 1T]</text>
<g transform="translate(50, 599)">
  <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Мобильное приложение (Touch Level Model, TLM)</text>
  <rect x="349.5" y="-12" width="223" height="20" rx="4" fill="#f5f3ff"/>
  <text x="461.0" y="2" font-size="10.5" font-weight="700" fill="#6d28d9" text-anchor="middle">Сенсорный ввод: 3.85 – 6.10 с</text>
</g>
<text x="296" y="624" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Экран 1: SSO Вход (BSU ID)</text>
<rect x="310" y="611" width="44.3" height="18" rx="4" fill="url(#bar-purple)"/>
<text x="364.3" y="624" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">3.85 с</text>
<text x="428.3" y="624" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[1T_init + 1Tap + 1FaceID]</text>
<text x="296" y="648" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Экран 2: QR Билет (Офлайн)</text>
<rect x="310" y="635" width="70.1" height="18" rx="4" fill="url(#bar-purple)"/>
<text x="390.1" y="648" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">6.10 с</text>
<text x="454.1" y="648" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[2Tap + 1Scroll + 1HMAC]</text>
<text x="296" y="672" font-size="11.5" font-weight="500" fill="#475569" text-anchor="end">Экран 3: Сканер допуска волонтёра</text>
<rect x="310" y="659" width="53.5" height="18" rx="4" fill="url(#bar-purple)"/>
<text x="373.5" y="672" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" fill="#0f172a">4.65 с</text>
<text x="437.5" y="672" font-family="JetBrains Mono, monospace" font-size="9.5" fill="#94a3b8">[1Tap + 1CamFocus + 1Haptic]</text>
<g transform="translate(50, 756)">
  <rect x="0" y="0" width="940" height="28" rx="6" fill="#f1f5f9"/>
  <text x="14" y="18" font-size="11.5" fill="#475569">⚡ <tspan font-weight="700" fill="#0f172a">Итог GOMS:</tspan> Вариант Б сокращает время ввода до 4.85 с при регистрации и 14.10 с при создании митапа (выигрыш в 2.3–7.9 раза).</text>
</g>
</svg>