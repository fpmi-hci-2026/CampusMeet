  <text x="0" y="0" font-size="13" font-weight="700" fill="#0f172a">Форма 3: Поиск и фильтрация</text>
  <rect x="236" y="-12" width="239" height="20" rx="4" fill="#ecfdf5"/>
  <text x="355.6" y="2" font-size="10.5" font-weight="700" fill="#047857" text-anchor="middle">Ускорение: в 3.54 раза (-71.7%)</text>
</g>
