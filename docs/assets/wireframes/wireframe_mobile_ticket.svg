<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 812" width="375" height="812" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <!-- Phone Frame background -->
  <rect width="375" height="812" rx="40" fill="#f9f9f9" stroke="#d4d4d4" stroke-width="3"/>
  <!-- Dynamic Island / Speaker notch -->
  <rect x="125" y="12" width="125" height="28" rx="14" fill="#0d0d0d"/>

  <!-- Mobile Header -->
  <g transform="translate(20, 55)">
    <text x="0" y="20" fill="#0d0d0d" font-size="18">←</text>
    <text x="167" y="20" fill="#0d0d0d" font-size="16" font-weight="bold" text-anchor="middle">[WIREFRAME] Мой билет</text>
    <text x="335" y="20" fill="#0d0d0d" font-size="16" text-anchor="end">↗</text>
  </g>

  <!-- Offline Status Badge -->
  <g transform="translate(20, 95)">
    <rect width="335" height="34" rx="8" fill="#f4f4f4" stroke="#d4d4d4"/>
    <circle cx="20" cy="17" r="4" fill="#0d0d0d"/>
    <text x="34" y="22" fill="#0d0d0d" font-size="11" font-weight="600">OFFLINE-READY: Билет сохранен в памяти</text>
  </g>

  <!-- Ticket Card Container -->
  <g transform="translate(20, 145)">
    <rect width="335" height="520" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    
    <!-- Header of card -->
    <rect x="0" y="0" width="335" height="90" rx="16" fill="#0d0d0d"/>
    <text x="20" y="32" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="0.5">CAMPUSMEET IT-EVENT</text>
    <text x="20" y="58" fill="#ffffff" font-size="16" font-weight="bold">AI &amp; Modern Web Meetup</text>
    <text x="20" y="78" fill="#8c8c8c" font-size="12">15 октября 2026 • 17:00 • Ауд. 512</text>

    <!-- Participant metadata -->
    <g transform="translate(20, 110)">
      <text x="0" y="15" fill="#737373" font-size="11">УЧАСТНИК</text>
      <text x="0" y="35" fill="#0d0d0d" font-size="15" font-weight="bold">Артём Ковалёв</text>

      <text x="200" y="15" fill="#737373" font-size="11">РОЛЬ / МЕСТО</text>
      <text x="200" y="35" fill="#0d0d0d" font-size="15" font-weight="bold">Слушатель • #88</text>
    </g>

    <!-- Dashed separator with punch notches -->
    <line x1="15" y1="175" x2="320" y2="175" stroke="#e5e5e5" stroke-dasharray="6,6" stroke-width="1.5"/>
    <circle cx="0" cy="175" r="12" fill="#f9f9f9"/>
    <circle cx="335" cy="175" r="12" fill="#f9f9f9"/>

    <!-- QR Code Section -->
    <g transform="translate(67, 205)">
      <rect width="200" height="200" rx="12" fill="#f4f4f4" stroke="#0d0d0d" stroke-width="2"/>
      <!-- QR corner locators -->
      <rect x="20" y="20" width="40" height="40" fill="#0d0d0d"/>
      <rect x="28" y="28" width="24" height="24" fill="#ffffff"/>
      <rect x="34" y="34" width="12" height="12" fill="#0d0d0d"/>

      <rect x="140" y="20" width="40" height="40" fill="#0d0d0d"/>
      <rect x="148" y="28" width="24" height="24" fill="#ffffff"/>
      <rect x="154" y="34" width="12" height="12" fill="#0d0d0d"/>

      <rect x="20" y="140" width="40" height="40" fill="#0d0d0d"/>
      <rect x="28" y="148" width="24" height="24" fill="#ffffff"/>
      <rect x="34" y="154" width="12" height="12" fill="#0d0d0d"/>

      <!-- Matrix simulation -->
      <rect x="75" y="30" width="15" height="15" fill="#0d0d0d"/>
      <rect x="100" y="45" width="20" height="15" fill="#0d0d0d"/>
      <rect x="85" y="80" width="30" height="30" fill="#0d0d0d"/>
      <rect x="130" y="100" width="20" height="25" fill="#0d0d0d"/>
      <rect x="40" y="90" width="25" height="25" fill="#0d0d0d"/>
      <rect x="90" y="140" width="35" height="20" fill="#0d0d0d"/>
      <rect x="145" y="145" width="25" height="25" fill="#0d0d0d"/>

      <text x="100" y="110" fill="#0d0d0d" font-size="11" font-weight="800" letter-spacing="1" text-anchor="middle">HMAC PASS</text>
    </g>

    <!-- Rolling Security Info -->
    <text x="167" y="430" fill="#737373" font-size="11" text-anchor="middle">Токен обновлен • Валиден еще 42с</text>
    <text x="167" y="448" fill="#0d0d0d" font-size="11" font-weight="600" text-anchor="middle">[OK] Яркость экрана установлена на 100%</text>

    <!-- Wallet Button (Ink button) -->
    <rect x="30" y="465" width="275" height="40" rx="8" fill="#0d0d0d"/>
    <text x="167" y="490" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Add to Apple Wallet</text>
  </g>

  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 735)">
    <rect width="375" height="77" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
    <text x="45" y="35" fill="#737373" font-size="11" text-anchor="middle">Афиша</text>
    <text x="135" y="35" fill="#0d0d0d" font-size="11" font-weight="bold" text-anchor="middle">● Билеты</text>
    <text x="235" y="35" fill="#737373" font-size="11" text-anchor="middle">Команды</text>
    <text x="330" y="35" fill="#737373" font-size="11" text-anchor="middle">Профиль</text>
  </g>
</svg>