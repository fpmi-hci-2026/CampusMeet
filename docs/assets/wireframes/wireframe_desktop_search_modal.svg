<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <pattern id="grid_search_modal" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e5e5e5" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Background (Dimmed Catalog) -->
  <rect width="1440" height="900" fill="#f9f9f9"/>
  <rect width="1440" height="900" fill="url(#grid_search_modal)" opacity="0.6"/>
  <rect width="1440" height="900" fill="#000000" opacity="0.5"/>

  <!-- Centered Search Omnibox Modal Window -->
  <g transform="translate(270, 70)">
    <!-- Modal Container -->
    <rect width="900" height="760" rx="14" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>

    <!-- Search Input Header -->
    <g transform="translate(30, 24)">
      <rect width="840" height="60" rx="10" fill="#f9f9f9" stroke="#0d0d0d" stroke-width="2"/>
      
      <!-- Vector Search Lens -->
      <circle cx="34" cy="30" r="7" fill="none" stroke="#0d0d0d" stroke-width="2"/>
      <line x1="39" y1="35" x2="46" y2="42" stroke="#0d0d0d" stroke-width="2"/>

      <text x="64" y="36" fill="#0d0d0d" font-size="18" font-weight="600">митап по голангу</text>
      <line x1="228" y1="18" x2="228" y2="42" stroke="#0d0d0d" stroke-width="2"/>
      
      <!-- Clear button & Keyboard Hint -->
      <rect x="730" y="16" width="46" height="28" rx="6" fill="#f4f4f4" stroke="#d4d4d4"/>
      <text x="753" y="35" fill="#404040" font-size="12" font-weight="bold" text-anchor="middle">⌘K</text>
      <rect x="784" y="16" width="46" height="28" rx="6" fill="#f4f4f4" stroke="#d4d4d4"/>
      <text x="807" y="35" fill="#404040" font-size="12" font-weight="bold" text-anchor="middle">ESC</text>
    </g>

    <!-- Did-You-Mean / Levenshtein Fuzzy Correction Banner -->
    <g transform="translate(30, 100)">
      <rect width="840" height="42" rx="8" fill="#f4f4f4" stroke="#d4d4d4" stroke-width="1"/>
      <text x="20" y="26" fill="#0d0d0d" font-size="13" font-weight="500">
        [i] Возможно, вы имели в виду: <tspan font-weight="bold">«Митап по Go / Golang»</tspan> <tspan fill="#737373">(нечеткий поиск Левенштейна, расстояние D = 1)</tspan>
      </text>
    </g>

    <!-- Active Facet Filters Row -->
    <g transform="translate(30, 156)">
      <text x="0" y="18" fill="#737373" font-size="11" font-weight="bold" letter-spacing="0.5">АКТИВНЫЕ ФАСЕТЫ:</text>
      
      <rect x="130" y="2" width="165" height="26" rx="13" fill="#0d0d0d"/>
      <text x="212" y="19" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">Формат: Офлайн-митап ×</text>

      <rect x="305" y="2" width="180" height="26" rx="13" fill="#f4f4f4" stroke="#d4d4d4"/>
      <text x="395" y="19" fill="#0d0d0d" font-size="11" font-weight="600" text-anchor="middle">Свободные места: Есть ×</text>

      <rect x="495" y="2" width="155" height="26" rx="13" fill="#ffffff" stroke="#e5e5e5"/>
      <text x="572" y="19" fill="#737373" font-size="11" text-anchor="middle">БГУ: Главный корпус ×</text>

      <text x="665" y="19" fill="#0d0d0d" font-size="12" font-weight="600" text-decoration="underline">+ Фильтры</text>
    </g>

    <line x1="30" y1="196" x2="870" y2="196" stroke="#e5e5e5" stroke-width="1"/>

    <!-- Results Section 1: Events (2 matches) -->
    <g transform="translate(30, 210)">
      <text x="0" y="16" fill="#737373" font-size="12" font-weight="bold" letter-spacing="0.5">МЕРОПРИЯТИЯ (2 НАЙДЕНО)</text>

      <!-- Result Card 1 -->
      <g transform="translate(0, 30)">
        <rect width="840" height="78" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
        <rect x="14" y="14" width="75" height="50" rx="6" fill="#0d0d0d"/>
        <text x="51" y="44" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">GO</text>

        <text x="105" y="30" fill="#0d0d0d" font-size="15" font-weight="700">CampusMeet #5: Distributed Systems &amp; Highload на <tspan text-decoration="underline">Go</tspan></text>
        <text x="105" y="52" fill="#737373" font-size="12">18 ноября 2026, 18:30 • Главный корпус БГУ, ауд. 512 • Докладчик: Виктор Громов</text>

        <!-- Availability Badge -->
        <rect x="680" y="24" width="140" height="30" rx="6" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="750" y="44" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">Осталось 14 мест</text>
      </g>

      <!-- Result Card 2 -->
      <g transform="translate(0, 118)">
        <rect width="840" height="78" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
        <rect x="14" y="14" width="75" height="50" rx="6" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="51" y="44" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">WS</text>

        <text x="105" y="30" fill="#0d0d0d" font-size="15" font-weight="700">Воркшоп: Паттерны многопоточности и каналы в <tspan text-decoration="underline">Golang</tspan></text>
        <text x="105" y="52" fill="#737373" font-size="12">25 ноября 2026, 17:00 • ФПМИ БГУ, ауд. 314 • Практикум с ноутбуками</text>

        <!-- Waitlist Badge -->
        <rect x="680" y="24" width="140" height="30" rx="6" fill="#ffffff" stroke="#0d0d0d" stroke-width="1.5"/>
        <text x="750" y="44" fill="#0d0d0d" font-size="12" font-weight="bold" text-anchor="middle">Лист ожидания (3)</text>
      </g>
    </g>

    <!-- Results Section 2: Speakers (1 match) -->
    <g transform="translate(30, 436)">
      <text x="0" y="16" fill="#737373" font-size="12" font-weight="bold" letter-spacing="0.5">ДОКЛАДЧИКИ И ЭКСПЕРТЫ (1 НАЙДЕН)</text>
      
      <g transform="translate(0, 30)">
        <rect width="840" height="66" rx="8" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
        <circle cx="45" cy="33" r="22" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="45" y="38" fill="#0d0d0d" font-size="13" font-weight="bold" text-anchor="middle">ВГ</text>

        <text x="85" y="28" fill="#0d0d0d" font-size="14" font-weight="700">Виктор Громов</text>
        <text x="85" y="48" fill="#737373" font-size="12">Lead Backend Architect • Доклад: «Raft Consensus и репликация на <tspan font-weight="600" fill="#0d0d0d">Go</tspan>»</text>

        <rect x="710" y="18" width="110" height="30" rx="6" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="765" y="38" fill="#0d0d0d" font-size="11" font-weight="600" text-anchor="middle">Профиль спикера</text>
      </g>
    </g>

    <!-- Results Section 3: Tags & Topics -->
    <g transform="translate(30, 560)">
      <text x="0" y="16" fill="#737373" font-size="12" font-weight="bold" letter-spacing="0.5">ТЕМАТИЧЕСКИЕ ТЕГИ</text>
      <g transform="translate(0, 28)">
        <rect x="0" y="0" width="85" height="28" rx="14" fill="#0d0d0d"/>
        <text x="42" y="18" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">#Golang</text>

        <rect x="95" y="0" width="135" height="28" rx="14" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="162" y="18" fill="#404040" font-size="12" text-anchor="middle">#DistributedSystems</text>

        <rect x="240" y="0" width="95" height="28" rx="14" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="287" y="18" fill="#404040" font-size="12" text-anchor="middle">#Highload</text>

        <rect x="345" y="0" width="115" height="28" rx="14" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="402" y="18" fill="#404040" font-size="12" text-anchor="middle">#Concurrency</text>

        <rect x="470" y="0" width="120" height="28" rx="14" fill="#f4f4f4" stroke="#d4d4d4"/>
        <text x="530" y="18" fill="#404040" font-size="12" text-anchor="middle">#Microservices</text>
      </g>
    </g>

    <!-- Modal Footer with Keyboard Shortcuts -->
    <g transform="translate(30, 680)">
      <line x1="0" y1="0" x2="840" y2="0" stroke="#e5e5e5" stroke-width="1"/>
      <text x="0" y="28" fill="#737373" font-size="12">
        <tspan font-weight="bold" fill="#0d0d0d">[↑ / ↓]</tspan> Навигация • 
        <tspan font-weight="bold" fill="#0d0d0d">[↵ Enter]</tspan> Перейти • 
        <tspan font-weight="bold" fill="#0d0d0d">[ESC]</tspan> Закрыть • 
        <tspan font-weight="bold" fill="#0d0d0d">[⌘+F]</tspan> Расширенный поиск
      </text>
      <text x="840" y="28" fill="#8c8c8c" font-size="11" text-anchor="end">Интеллектуальный Omnibox CampusMeet (Fuzzy &amp; Facet Search)</text>
    </g>
  </g>
</svg>